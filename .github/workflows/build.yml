name: 打包安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 接受安卓 SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 生成安卓工程与插件配置
        run: |
          VER_NAME="4.0.${{ github.run_number }}"
          mkdir -p www && cp index.html www/index.html
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VER_NAME}'/" www/index.html
          cat > package.json <<'EOF'
          {
            "name": "xiaozhangben",
            "version": "4.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/network": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.xiaozhangben.app",
            "appName": "小账本",
            "webDir": "www",
            "android": {
              "backgroundColor": "#F4F6FA",
              "adjustMarginsForEdgeToEdge": "force"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              },
              "LocalNotifications": {
                "iconColor": "#2555A6"
              }
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: 注入原生插件、图标、权限与版本号
        run: |
          VER_CODE=$((300 + ${{ github.run_number }}))
          VER_NAME="4.0.${{ github.run_number }}"
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon.png $RES/mipmap-$d/$f.png; done
          done
          cp android-src/*.java android/app/src/main/java/com/xiaozhangben/app/
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          """
          svc = """        <service
                  android:name=".PayNotificationService"
                  android:label="小账本付款通知捕账"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.service.notification.NotificationListenerService" />
                  </intent-filter>
              </service>
          """
          s = s.replace("</manifest>", perms + "</manifest>", 1)
          s = s.replace("</application>", svc + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          sed -i -E "s/versionCode [0-9]+/versionCode ${VER_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VER_NAME}\"/" android/app/build.gradle

      - name: 打包并签名
        run: |
          VER_NAME="4.0.${{ github.run_number }}"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=xiaozhangben-v${VER_NAME}.apk
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias xiaozhangben --ks-pass pass:xzb-2026-key --key-pass pass:xzb-2026-key --out $OUT aligned.apk
          $BT/apksigner verify $OUT

      - name: 发布安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: 小账本 · 智能增强版 v4.0.${{ github.run_number }}
          body: |
            下载下面的 apk 文件，在安卓手机上直接点开安装（覆盖旧版保留全部历史数据）。

            智能增强版 v4.0 全新升级（全部智能与捕账功能默认关闭，每项独立开关）：
            - 🔍 全维度单字/多词不漏搜：搜“蛋”“果”“买菜”“超市”同时检索大类、小类、备注、标签、人名、账户，顶部自动展示命中品类分布汇总
            - 🤖 AI 智能助手（内置智谱免费版 + 通义千问 + 自定义接口，全独立开关）：
              · 🗣️ 语音/一句话智能拆账（支持一次拆出日常消费 + 人情往来 + 借入借出）
              · 📷 拍小票/账单截图批量识图（支持「整单合并写全明细备注」⇄「按品类拆单+打场景标签」一键切换）
              · 🧠 手动记账智能猜分类 + 📊 脱敏 AI 月度财务诊断（零备注零人名上传）
            - 🔔 安卓原生微信/支付宝/云闪付付款通知自动捕账（独立开关，支持先确认入账或自动分类入账）
          files: xiaozhangben-v4.0.${{ github.run_number }}.apk
          make_latest: true
