name: 自动打包安卓 APK (完整版)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 20 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 初始化工程配置与离线解析库
        run: |
          cat << 'EOF' > package.json
          {
            "name": "fangyuan-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/app": "^6.0.0",
              "@capacitor/camera": "^6.0.0",
              "@capacitor/core": "^6.0.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/local-notifications": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0",
              "heic2any": "^0.0.4",
              "mammoth": "^1.8.0",
              "pdfjs-dist": "^3.11.174",
              "xlsx": "^0.18.5"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.fangyuan.app",
            "appName": "房源管理",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": { "allowMixedContent": true }
          }
          EOF

          npm install

      - name: 4. 打包离线文档与 HEIC 引擎进单文件网页
        run: |
          cat << 'EOF' > inject_vendors.js
          const fs = require("fs");
          let html = fs.readFileSync("www/index.html", "utf-8");
          const vendors = [
            { tag: "<!-- VENDOR_XLSX -->", file: "node_modules/xlsx/dist/xlsx.full.min.js" },
            { tag: "<!-- VENDOR_MAMMOTH -->", file: "node_modules/mammoth/mammoth.browser.min.js" },
            { tag: "<!-- VENDOR_PDFJS -->", file: "node_modules/pdfjs-dist/build/pdf.min.js" },
            { tag: "<!-- VENDOR_HEIC2ANY -->", file: "node_modules/heic2any/dist/heic2any.min.js" }
          ];
          for (const v of vendors) {
            if (fs.existsSync(v.file)) {
              html = html.replace(v.tag, "<script>" + fs.readFileSync(v.file, "utf-8") + "<\/script>");
            }
          }
          const wp = "node_modules/pdfjs-dist/build/pdf.worker.min.js";
          if (fs.existsSync(wp)) {
            const b64 = Buffer.from(fs.readFileSync(wp, "utf-8")).toString("base64");
            html = html.replace("<!-- VENDOR_PDFWORKER -->", `<script>window.__PDF_WORKER_B64__="${b64}";<\/script>`);
          }
          fs.writeFileSync("www/index.html", html, "utf-8");
          EOF
          node inject_vendors.js

      - name: 5. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. 编译生成安卓 APK 安装包
        run: |
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p ../release_out
          cp app/build/outputs/apk/debug/app-debug.apk "../release_out/房源管理-完整版-v1.0.${{ github.run_number }}.apk"

      - name: 7. 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "房源管理 App (完整版) v1.0.${{ github.run_number }}"
          files: release_out/*.apk
