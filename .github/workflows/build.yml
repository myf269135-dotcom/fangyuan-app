name: 打包安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 接受安卓 SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 生成安卓工程与插件配置
        run: |
          VER_CODE=$((200 + ${{ github.run_number }}))
          VER_NAME="3.0.${{ github.run_number }}"
          mkdir -p www && cp index.html www/index.html
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VER_NAME}'/" www/index.html
          cat > package.json <<'EOF'
          {
            "name": "xiaozhangben",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/network": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.xiaozhangben.app",
            "appName": "小账本",
            "webDir": "www",
            "android": {
              "backgroundColor": "#F3F2EE",
              "adjustMarginsForEdgeToEdge": "force"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              },
              "LocalNotifications": {
                "iconColor": "#2D4B7C"
              }
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: 图标、权限与版本号
        run: |
          VER_CODE=$((200 + ${{ github.run_number }}))
          VER_NAME="3.0.${{ github.run_number }}"
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon.png $RES/mipmap-$d/$f.png; done
          done
          PERMS='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />'
          sed -i "s#</manifest>#${PERMS}\n</manifest>#" android/app/src/main/AndroidManifest.xml
          sed -i -E "s/versionCode [0-9]+/versionCode ${VER_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VER_NAME}\"/" android/app/build.gradle

      - name: 打包并签名
        run: |
          VER_NAME="3.0.${{ github.run_number }}"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=xiaozhangben-v${VER_NAME}.apk
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias xiaozhangben --ks-pass pass:xzb-2026-key --key-pass pass:xzb-2026-key --out $OUT aligned.apk
          $BT/apksigner verify $OUT

      - name: 发布安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: 小账本 · 焕新旗舰版 v3.0.${{ github.run_number }}
          body: |
            下载下面的 apk 文件，在安卓手机上直接点开安装（覆盖旧版保留全部历史数据）。

            焕新旗舰版 v3.0 全新升级：
            - 全新现代金融美学设计：4 套主题皮肤（深海蓝/翡翠绿/暖阳金/暮光紫）+ 深浅模式 + 悬浮磨砂底栏
            - 首页全面重构：流光预算进度条（含日均可花）、2×4 彩色金刚区、即将到期周期账预告、一键隐私打码模式
            - 记一笔内置计算器数字键盘（支持 36+18.5 现场算账）+ 快捷模板一键直达条
            - 全新「借入借出 / 欠款备忘本」（登记部分还款、一键结清、联动总资产看板）
            - 报表升级「本期财务体检洞察（储蓄率/日均/环比涨跌）」+「消费 Top 10 排行榜」
            - 完整保留：本地与坚果云双自动备份、挖财 Excel/CSV 导入、安卓每日通知、人情账簿、牌局统计
          files: xiaozhangben-v3.0.${{ github.run_number }}.apk
          make_latest: true
