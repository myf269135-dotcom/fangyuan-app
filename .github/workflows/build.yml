name: 打包安卓安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 接受安卓 SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 生成安卓工程与插件配置
        run: |
          VER_NAME="4.1.${{ github.run_number }}"
          mkdir -p www && cp index.html www/index.html
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VER_NAME}'/" www/index.html
          cat > package.json <<'EOF'
          {
            "name": "xiaozhangben",
            "version": "4.1.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/network": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.xiaozhangben.app",
            "appName": "挖财日记",
            "webDir": "www",
            "android": {
              "backgroundColor": "#F5F7FB",
              "adjustMarginsForEdgeToEdge": "force"
            },
            "plugins": {
              "CapacitorHttp": {
                "enabled": true
              },
              "LocalNotifications": {
                "iconColor": "#3B82F6"
              }
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: 注入原生插件、图标、权限与版本号
        run: |
          VER_CODE=$((400 + ${{ github.run_number }}))
          VER_NAME="4.1.${{ github.run_number }}"
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon.png $RES/mipmap-$d/$f.png; done
          done
          cp android-src/*.java android/app/src/main/java/com/xiaozhangben/app/
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
          """
          svc = """        <service
                  android:name=".PayNotificationService"
                  android:label="挖财日记付款通知捕账"
                  android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.service.notification.NotificationListenerService" />
                  </intent-filter>
              </service>
          """
          s = s.replace("</manifest>", perms + "</manifest>", 1)
          s = s.replace("</application>", svc + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          gp = "android/app/build.gradle"
          gs = open(gp, encoding="utf-8").read()
          if "okhttp3:okhttp" not in gs:
              gs = gs.replace("dependencies {\n", 'dependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"\n', 1)
              open(gp, "w", encoding="utf-8").write(gs)
          PY
          sed -i -E "s/versionCode [0-9]+/versionCode ${VER_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VER_NAME}\"/" android/app/build.gradle

      - name: 打包并签名
        run: |
          VER_NAME="4.1.${{ github.run_number }}"
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=wacairiji-v${VER_NAME}.apk
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias xiaozhangben --ks-pass pass:xzb-2026-key --key-pass pass:xzb-2026-key --out $OUT aligned.apk
          $BT/apksigner verify $OUT

      - name: 发布安装包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.${{ github.run_number }}
          name: 挖财日记 v4.1.${{ github.run_number }}
          body: |
            下载下面的 apk 文件，在安卓手机上直接点开安装（沿用原包名与签名，覆盖装在旧版「小账本」上面自动改名并保留全部历史数据与坚果云配置）。

            本次焕新升级：
            - 全新更名「挖财日记」+ 全新明亮清透 3D 玻璃质感设计图标
            - 整体色调全面提亮，告别暗沉深色，新增 8 套明亮全站统一主题配色（晴空蓝 / 元气橘红 / 中国红 / 暖阳橙 / 薄荷绿 / 樱花粉 / 香芋紫 / 奶咖棕）
            - 新增 4 种顶部背景纹理（流光柔雾 / 几何波浪 / 星点微光 / 极简纯色），首页点「🎨 换色」一键全站同步换色（顶部背景、日期、按钮、底部＋号全部统一变色）
          files: wacairiji-v4.1.${{ github.run_number }}.apk
          make_latest: true
