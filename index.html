<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2D4B7C">
<title>小账本</title>
<style>
/* ===================== 样式（焕新旗舰版 v3.0） ===================== */
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#171D29; --sub:#7C8496; --line:#ECEFF5;
  --pri:#2555A6; --pri2:#173873; --pri-soft:#EBF2FF; --acc:#F59E0B; --acc2:#EA580C;
  --tr:#4F7AE8; --danger:#E5484D;
  --r:20px;
  --green:#10B981; --orange:#F97316; --green-soft:#E8FAF3; --orange-soft:#FFF2E8;
  --exp:var(--green); --inc:var(--orange); --exp-soft:var(--green-soft); --inc-soft:var(--orange-soft);
  --ink2:#374151; --inp:#F8FAFC; --seg-on:#FFFFFF; --tabbar:rgba(255,255,255,.88); --danger-soft:#FEECEC;
  --dash:#C4D2EC; --faint:#A6AEBE; --warn-bg:#FFF5E0; --warn-ink:#925800;
  --hd1:#1E3A8A; --hd2:#2563EB; --hd3:#0F172A;
  --shadow:0 4px 18px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.03);
}
/* 4 套精选皮肤色（浅色态） */
html[data-skin=jade]{--pri:#0F766E; --pri2:#0B4F4A; --pri-soft:#E6F7F5; --hd1:#064E3B; --hd2:#0D9488; --hd3:#042F2E; --dash:#A7D7D2}
html[data-skin=amber]{--pri:#B45309; --pri2:#78350F; --pri-soft:#FEF3E2; --hd1:#78350F; --hd2:#D97706; --hd3:#451A03; --dash:#E7C89E}
html[data-skin=violet]{--pri:#6D28D9; --pri2:#4C1D95; --pri-soft:#F2ECFE; --hd1:#3B0764; --hd2:#7C3AED; --hd3:#1E1B4B; --dash:#C9B6F2}

html[data-theme=dark]{
  --bg:#0E1117; --card:#171B24; --ink:#EDF1F7; --ink2:#C4CBD8; --sub:#8892A4; --line:#252B38;
  --pri:#60A5FA; --pri2:#1E3A8A; --pri-soft:#1B2942; --inp:#12161F; --seg-on:#252C3B; --tabbar:rgba(23,27,36,.88);
  --green:#34D399; --orange:#FB923C; --green-soft:#122E26; --orange-soft:#342115; --danger-soft:#361A1E;
  --dash:#33415C; --faint:#5A6375; --warn-bg:#332811; --warn-ink:#F6D379;
  --hd1:#172554; --hd2:#1E40AF; --hd3:#0B1120;
  --shadow:0 6px 20px rgba(0,0,0,.32);
}
html[data-theme=dark][data-skin=jade]{--pri:#2DD4BF; --pri-soft:#13312E; --hd1:#064E3B; --hd2:#0F766E; --hd3:#022C22}
html[data-theme=dark][data-skin=amber]{--pri:#FBBF24; --pri-soft:#332412; --hd1:#78350F; --hd2:#B45309; --hd3:#2A1205}
html[data-theme=dark][data-skin=violet]{--pri:#A78BFA; --pri-soft:#261C42; --hd1:#3B0764; --hd2:#6D28D9; --hd3:#170A2E}
html[data-colors=swap]{--exp:var(--orange); --inc:var(--green); --exp-soft:var(--orange-soft); --inc-soft:var(--green-soft)}
html[data-theme=dark] body{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.45}
body{max-width:520px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
input,select,textarea{font:inherit;color:inherit}
.num,b,.ri-amt{font-variant-numeric:tabular-nums}
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
svg{width:22px;height:22px;display:block}
#main{padding-bottom:104px}

/* 顶部 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.topbar h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.3px}
.ibtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active{background:rgba(0,0,0,.06);transform:scale(.94)}
.ibtn.light{color:#fff;background:rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.ibtn.light:active{background:rgba(255,255,255,.24)}

/* 卡片 */
.card{background:var(--card);border-radius:var(--r);margin:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(148,163,184,.08)}
.card.pad{padding:15px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 6px;font-weight:700;font-size:15.5px}
.card-h small{color:var(--sub);font-weight:400;font-size:12.5px}

/* 首页旗舰沉浸头部 */
.home-hd{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--hd1) 0%,var(--hd2) 55%,var(--hd3) 100%);color:#fff;padding:12px 14px 36px;border-radius:0 0 28px 28px;box-shadow:0 10px 28px rgba(15,23,42,.16)}
.home-hd::before{content:"";position:absolute;right:-44px;top:-44px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.home-hd::after{content:"";position:absolute;left:-50px;bottom:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.18),transparent 72%);pointer-events:none}
.home-hd>*{position:relative;z-index:1}
.hd-top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.hd-acts{display:flex;align-items:center;gap:4px;flex:none}
.hd-acts .ibtn.light{width:33px;height:33px;border-radius:10px}
.hd-acts .ibtn.light svg{width:19px;height:19px}
.mnav{display:flex;align-items:center;gap:1px;font-weight:600;font-size:15px;min-width:0;flex:1}
.mnav button{width:26px;height:30px;border-radius:8px;color:#fff;font-size:18px;flex:none}
.mnav button:active{background:rgba(255,255,255,.18)}
.hd-lbl{opacity:.8;font-size:13px;margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.hd-big{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,.15)}
.hd-big small{font-size:21px;opacity:.88;font-weight:700}
.hd-prog{margin-top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.hd-prog-t{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.92;margin-bottom:6px;gap:8px}
.hd-prog-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.hd-prog-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34D399,#FBBF24);transition:width .35s ease}
.hd-prog-bar i.over{background:linear-gradient(90deg,#FB7185,#EF4444)}
.hd-row{display:flex;gap:10px;margin-top:10px}
.hd-row>div{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:14px;padding:9px 12px}
.hd-row span{display:block;font-size:12px;opacity:.8}
.hd-row b{font-size:16.5px;font-weight:700}
.hd-row .over{color:#FFB4A0}
.warn-bar{margin:10px 14px 0;padding:10px 12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;font-size:13px}

/* 月历 */
.cal{margin-top:-20px;position:relative;padding:10px 8px 8px}
.cal-wk,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wk div{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 6px}
.cd{min-height:58px;border-radius:12px;padding:5px 1px 4px;text-align:center;border:1.5px solid transparent}
.cd:active{background:var(--bg)}
.cd-n{font-size:15px;font-weight:600;width:26px;height:26px;line-height:26px;margin:0 auto;border-radius:50%}
.cd.today .cd-n{background:var(--pri);color:#fff}
.cd.sel{border-color:var(--pri);background:var(--pri-soft)}
.cd-e,.cd-i{font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.cd-e{color:var(--exp)} .cd-i{color:var(--inc)}
.cd.blank{pointer-events:none}

/* 当日明细 */
.day-hd{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 4px}
.day-hd b{font-size:15px}
.day-hd span{font-size:12px;color:var(--sub)}
.empty{padding:26px 16px 22px;text-align:center;color:var(--sub);font-size:14px}
.empty .btn{margin-top:12px}

/* 记录行 */
.ri{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.ri:active{background:var(--bg)}
.ri+.ri::before{content:"";position:absolute;left:64px;right:0;top:0;border-top:1px solid var(--line)}
.ri-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:var(--exp-soft)}
.ri-ic.inc{background:var(--inc-soft)} .ri-ic.tr{background:var(--pri-soft)}
.ri-mid{flex:1;min-width:0}
.ri-t{font-weight:600;font-size:15px}
.ri-s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-tags{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.ri-tags span{font-size:11px;color:var(--pri);background:var(--pri-soft);padding:0 6px;border-radius:6px}
.ri-amt{font-weight:700;font-size:16px;white-space:nowrap}
.exp{color:var(--exp)} .inc{color:var(--inc)} .tr{color:var(--tr)}

/* 底部贴底固定导航（实底无缝，不悬浮、不露底字） */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;z-index:20;box-shadow:0 -2px 10px rgba(15,23,42,.05)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar .plus{flex:none;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;margin:-20px 8px 0;
  box-shadow:0 6px 16px rgba(245,158,11,.42), 0 0 0 3px var(--card);justify-content:center}
.tabbar .plus svg{width:28px;height:28px}
.tabbar .plus:active{transform:scale(.92)}

/* 按钮 */
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--bg);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-o{color:var(--danger);background:var(--danger-soft)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.grow{flex:1}
.btn.block{width:100%}

/* 标签式选择 chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--bg);font-size:14px;border:1.5px solid transparent;white-space:nowrap}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.chip.add{color:var(--pri);border:1.5px dashed var(--dash);background:transparent}
.chip.strong{font-weight:700}
.chip.dim{opacity:.55}

/* 分段 */
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{white-space:nowrap;padding:6px 12px;border-radius:9px;font-size:14px;color:var(--sub);font-weight:600}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.expense{color:var(--exp)} .seg button.on.income{color:var(--inc)} .seg button.on.transfer{color:var(--tr)}
.seg.full{display:flex} .seg.full button{flex:1}

/* 图层：页面 / 弹窗 / 底部菜单 */
.layer{position:fixed;inset:0;z-index:50}
.page{position:absolute;inset:0;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.layer.show .page{transform:none}
.pg-head{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.pg-head h2{flex:1;margin:0;font-size:17px;text-align:center}
.pg-right{min-width:40px;display:flex;justify-content:flex-end}
.pg-body{flex:1;overflow-y:auto;padding-bottom:30px;-webkit-overflow-scrolling:touch}
.mask{position:absolute;inset:0;background:rgba(15,20,30,.42);opacity:0;transition:opacity .2s}
.layer.show .mask{opacity:1}
.dlg{position:absolute;left:50%;top:50%;width:min(88vw,380px);max-height:84vh;overflow-y:auto;background:var(--card);border-radius:20px;padding:20px 18px 16px;
  transform:translate(-50%,-46%);opacity:0;transition:.2s}
.layer.show .dlg{transform:translate(-50%,-50%);opacity:1}
.dlg h3{margin:0 0 12px;font-size:17px;text-align:center}
.dlg-body{font-size:14.5px;color:var(--ink2)}
.dlg-body p{margin:0 0 8px}
.dlg-btns{display:flex;gap:10px;margin-top:16px}
.dlg-btns .btn{flex:1}
.as{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s;max-height:80vh;overflow-y:auto}
.layer.show .as{transform:none}
.as-t{text-align:center;color:var(--sub);font-size:13px;padding:8px 0 6px}
.as-i{display:block;width:100%;padding:14px;text-align:center;font-size:16px;border-radius:12px}
.as-i:active{background:var(--bg)}
.as-i.danger{color:var(--danger)}
.as-i.cancel{margin-top:6px;background:var(--bg);font-weight:600}
.as-i small{display:block;color:var(--sub);font-size:12px}

/* 表单 */
.fld{padding:10px 16px}
.fld>label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.fld>label small{color:var(--faint)}
.fld.row{display:flex;align-items:center;gap:12px}
.fld.row>label{margin:0;width:44px;flex:none}
.fld.row input{flex:1}
.inp,.fld input:not([type=radio]):not([type=file]),.fld select,textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--inp);outline:none}
textarea{height:120px;padding:10px 12px;resize:vertical;font-size:12px}
.inp:focus,.fld input:focus,.fld select:focus,textarea:focus{border-color:var(--pri)}
.tip{font-size:12.5px;color:var(--sub);margin:8px 0 0}
.radio{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14.5px}
.radio input{width:18px;height:18px;accent-color:var(--pri)}
.radio select{height:36px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:var(--inp);flex:1}

.form-page .fp-head{display:flex;align-items:center;justify-content:space-between;padding:8px;background:var(--card);flex:none}
.tbtn{padding:8px 12px;border-radius:10px;color:var(--pri);font-weight:600}
.tbtn:active{background:var(--pri-soft)}
.fp-body{flex:1;overflow-y:auto;background:var(--card);padding-bottom:20px}
.fp-foot{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex:none}
.amt-box{margin:6px 16px 0;padding:12px 14px;border-radius:16px;background:var(--bg);display:flex;align-items:center;gap:10px}
.amt-cat{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;max-width:42%;flex:none}
.amt-cat .ic{font-size:22px}
.amt-cat .ph{color:var(--sub);font-weight:400}
.amt-in{flex:1;display:flex;align-items:center;justify-content:flex-end;min-width:0}
.amt-in span{font-size:22px;font-weight:700;margin-right:4px}
.amt-in input{width:100%;border:0;background:transparent;outline:none;text-align:right;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.amt-box.expense .amt-in{color:var(--exp)} .amt-box.income .amt-in{color:var(--inc)} .amt-box.transfer .amt-in{color:var(--tr)}
.ferr{color:var(--danger);font-size:13px;padding:4px 18px 0;min-height:4px;display:none}
.ferr.show{display:block}

.catbox{margin:10px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tabs button{flex:none;font-size:13px;padding:5px 10px;border-radius:14px;background:var(--bg)}
.cat-scroll{position:relative;max-height:262px;overflow-y:auto;padding:0 8px 8px}
.cg-h{font-size:12.5px;color:var(--sub);padding:10px 8px 4px;font-weight:600}
.cg-g{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.ci{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px}
.ci:active{background:var(--bg)}
.ci-ic{width:40px;height:40px;border-radius:13px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;border:1.5px solid transparent}
.ci-nm{font-size:12px;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci.on .ci-ic{background:var(--pri-soft);border-color:var(--pri)}
.ci.on .ci-nm{color:var(--pri);font-weight:600}
.ci.add .ci-ic{background:transparent;border:1.5px dashed var(--dash);color:var(--pri);font-size:20px}
.ci.add .ci-nm{color:var(--pri)}
.cat-tip{font-size:11.5px;color:var(--faint);text-align:center;padding:6px 0 2px}

.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.add{flex-direction:column;gap:2px;border:1.5px dashed var(--dash);background:transparent;color:var(--pri);font-size:11px;cursor:pointer}
.viewer{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center}
.viewer img{max-width:100%;max-height:78vh}
.vw-btns{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:12px}

.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:170px;overflow-y:auto;padding:2px}
.emo{font-size:21px;height:38px;border-radius:10px;border:1.5px solid transparent}
.emo.on{background:var(--pri-soft);border-color:var(--pri)}

/* 明细 */
.range{display:flex;align-items:center;gap:8px;margin-top:10px}
.range input{flex:1;min-width:0;height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:var(--inp)}
.srch{display:flex;gap:8px;margin-top:10px}
.srch-in{flex:1;display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:0 10px;color:var(--sub)}
.srch-in svg{width:18px;height:18px;flex:none}
.srch-in input{flex:1;border:0;background:transparent;outline:none;height:36px;min-width:0;color:var(--ink)}
.fsum{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.fsum a{color:var(--pri);font-weight:600;margin-left:6px}
.grp-h{display:flex;justify-content:space-between;padding:12px 16px 4px;font-size:13px;color:var(--sub)}
.sumbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:8px;padding:9px 16px;font-size:13px;z-index:19;box-shadow:0 -2px 8px rgba(0,0,0,.03)}
.sumbar b{font-size:14px}
.more-tip{text-align:center;font-size:12px;color:var(--sub);padding:12px}
.detail-pad{height:44px}

/* 筛选页 */
.fsec{background:var(--card);margin:10px 0;padding:12px 16px}
.fsec>h4{margin:0 0 10px;font-size:14px}
.fgrp{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fgrp:last-child{border-bottom:0}
.minmax{display:flex;align-items:center;gap:8px}
.minmax input{flex:1;min-width:0}

/* 报表 */
.rp-ctl{display:flex;flex-direction:column;gap:10px}
.rp-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pnav{display:flex;align-items:center;gap:4px;font-weight:600}
.pnav button{width:32px;height:32px;border-radius:10px;background:var(--bg);font-size:18px}
.rp-row select{height:34px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:var(--inp);font-size:13.5px;max-width:48%}
.donut{width:200px;height:200px;margin:4px auto 0;display:block}
.d-l{font-size:12px;fill:var(--sub)}
.d-v{font-size:22px;font-weight:700;fill:var(--ink)}
.lg{display:flex;align-items:center;gap:10px;padding:9px 16px}
.lg:active{background:var(--bg)}
.lg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.lg-ic{font-size:18px;flex:none}
.lg-mid{flex:1;min-width:0}
.lg-t{display:flex;justify-content:space-between;font-size:14px}
.lg-t span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-t span:last-child{color:var(--sub);font-size:12.5px;flex:none;margin-left:6px}
.bar{height:5px;background:var(--bg);border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.lg-r{text-align:right;flex:none}
.lg-r b{display:block;font-size:14px}
.lg-r small{color:var(--sub);font-size:11.5px}
.trend{width:100%;height:auto;display:block;padding:0 8px}
.t-x{font-size:9px;fill:var(--sub)}
.legend2{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);padding:2px 0 8px}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:8px 16px;text-align:right;border-top:1px solid var(--line)}
.tb th{color:var(--sub);font-weight:500}
.tb th:first-child,.tb td:first-child{text-align:left}

/* 账户 / 管理列表 */
.net{padding:18px 16px}
.net span{font-size:13px;color:var(--sub)}
.net b{display:block;font-size:30px;margin-top:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;min-height:56px}
.mrow:active{background:var(--bg)}
.mrow+.mrow::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.mrow .ic{width:36px;height:36px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.mrow .nm{flex:1;min-width:0;font-weight:500}
.mrow .nm small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.mrow .val{font-weight:700;white-space:nowrap}
.mrow.sub{padding-left:40px}
.mrow.dim .ic,.mrow.dim .nm{opacity:.45}
.badge{font-size:11px;color:var(--sub);background:var(--bg);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:400}
.more{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none}
.more:active{background:var(--line)}
.chev{color:var(--faint);flex:none}
.chev svg{width:18px;height:18px}
.list-tip{font-size:12.5px;color:var(--sub);padding:4px 18px 10px;line-height:1.6}
.addline{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--pri);font-weight:600;padding:14px;border-top:1px solid var(--line)}

/* 年月选择 / 首页浏览 */
.mtitle{display:inline-flex;align-items:center;gap:2px;color:#fff;font-weight:700;font-size:15px;padding:3px 7px;border-radius:9px;background:rgba(255,255,255,.14)}
.mnav .mtitle{width:auto;height:30px;white-space:nowrap;font-size:15px}
.mtitle small{font-size:11px;opacity:.85}
.ptitle{min-width:130px;white-space:nowrap;text-align:center;font-weight:600;padding:5px 8px;border-radius:10px;background:var(--pri-soft);color:var(--pri)}
@keyframes slL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.anim-l{animation:slL .22s ease}.anim-r{animation:slR .22s ease}
.cal-tip{text-align:center;font-size:11px;color:var(--faint);padding:4px 0 2px}
.day-grp{scroll-margin-top:12px;transition:box-shadow .2s}
.day-grp.hl{box-shadow:0 0 0 2px var(--pri)}
.prev-month{display:flex;width:calc(100% - 28px);margin:6px 14px 0;background:var(--card);color:var(--pri)}
.yv-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.yv-hd .nav{width:42px;height:42px;border-radius:12px;background:var(--card);font-size:20px}
.yv-t{font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;color:var(--pri)}
.yv-t:active{background:var(--pri-soft)}
.yv-sum{text-align:center;font-size:13px;color:var(--sub);padding-bottom:6px}
.mgrid,.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px}
.mc{background:var(--card);border-radius:14px;padding:12px;min-height:86px;border:1.5px solid transparent;display:flex;flex-direction:column;gap:2px}
.mc:active,.yc:active{filter:brightness(.96)}
.mc b{font-size:18px}
.mc span{font-size:12px;font-variant-numeric:tabular-nums}
.mc.sel,.yc.sel{border-color:var(--pri);background:var(--pri-soft)}
.mc.cur b{color:var(--pri)}
.mc.cur b::after{content:" 本月";font-size:11px;font-weight:500}
.yc{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;border:1.5px solid transparent}
.yc b{display:block;font-size:19px}
.yc small{color:var(--sub);font-size:11.5px}

/* 第二阶段 */
.qk{display:flex;gap:8px;margin-top:12px}
.qk button{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:7px 0 6px;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.qk button:active{background:rgba(255,255,255,.2)}
.qk .e{font-size:18px;line-height:1.2}
.hd-row small{display:block;font-size:11px;color:#FFB4A0;margin-top:1px}
.banner{margin:10px 14px 0;padding:10px 12px;border-radius:12px;font-size:13.5px;display:flex;align-items:center;gap:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.banner span{flex:1}
.banner .x{color:var(--sub);padding:4px 8px;font-size:16px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;cursor:pointer}
.switch-row b{font-weight:600;font-size:14.5px}
.switch-row small{display:block;color:var(--sub);font-size:12px;margin-top:2px;font-weight:400}
.switch-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s;cursor:pointer;margin:0}
.switch-row input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch-row input[type=checkbox]:checked{background:var(--pri)}
.switch-row input[type=checkbox]:checked::after{left:23px}
.kvs{margin-top:12px}
.kvs>div,.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kvs span,.kv span{color:var(--sub);flex:none}
.kvs b,.kv b{text-align:right}
.stat3{display:flex;gap:6px}
.stat3>div{flex:1;text-align:center}
.stat3 span{display:block;font-size:12px;color:var(--sub)}
.stat3 b{font-size:16px}
.bgline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--sub)}
.bgline b{color:var(--ink)}
.bgrow{padding:11px 16px;border-top:1px solid var(--line)}
.bgrow:active{background:var(--bg)}
.bg-t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}
.bg-t span:last-child{font-size:13px;color:var(--sub);flex:none}
.bg-s{font-size:12px;color:var(--sub);margin-top:4px}
.rb+.rb{border-top:1px solid var(--line)}
.rb-a{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.rb-a span{flex:1;font-size:12px;color:var(--sub)}
.pickbtn{text-align:left;display:block;line-height:39px;cursor:pointer}
.rec-tip{font-size:12.5px;color:var(--pri);background:var(--pri-soft);margin:8px 16px 0;padding:8px 10px;border-radius:10px}
.ri-t small.b{white-space:nowrap;display:inline-block;font-size:10.5px;color:var(--sub);background:var(--bg);border-radius:5px;padding:0 5px;font-weight:400;margin-left:4px;vertical-align:1px}
.sample{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 8px;vertical-align:0}

.hid-note{margin:2px 16px 8px;padding:9px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px;text-align:center;line-height:1.5}
.hid-note b{color:inherit}

/* 报表 2 */
.sum3{display:flex;gap:8px}
.sc{flex:1;min-width:0;text-align:left;background:var(--bg);border-radius:12px;padding:9px 10px;border:1.5px solid transparent}
.sc span{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.sc b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sc b small{font-size:11px}
.sc.on{border-color:var(--acc);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tgl{display:flex;gap:8px;flex:1;min-width:0}
.tgl button{flex:1;min-width:0;text-align:left;padding:6px 10px;border-radius:12px;border:1.5px dashed var(--dash);color:var(--sub);background:transparent}
.tgl button span{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl button small{display:block;font-size:11px}
.tgl button.on{border:1.5px solid var(--pri);background:var(--pri-soft);color:var(--pri)}
.tgl.light{margin-top:10px}
.tgl.light button{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.75)}
.tgl.light button span{color:#fff}
.tgl.light button.on{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.8);color:#fff}
.rp-tg{display:flex;gap:8px;align-items:stretch}
.fbtn{flex:none;width:44px;height:auto;border-radius:12px;background:var(--bg);position:relative;color:var(--sub)}
.fbtn.on{color:var(--pri);background:var(--pri-soft)}
.fbtn i{position:absolute;top:4px;right:5px;font-style:normal;font-size:10px;background:var(--pri);color:#fff;border-radius:8px;min-width:15px;height:15px;line-height:15px;text-align:center}
.prange{font-weight:600;font-size:14px;padding:6px 0}
.back-chip{position:absolute;left:0;font-size:12px;color:var(--pri);background:var(--pri-soft);padding:5px 8px;border-radius:9px}
.lvl-btn{font-size:12.5px;color:var(--pri);background:var(--pri-soft);padding:4px 10px;border-radius:9px;font-weight:500}
.bar-info{margin:0 14px 6px;padding:8px 10px;border-radius:10px;font-size:12.5px;color:var(--sub);background:var(--bg);display:flex;align-items:center;gap:8px;min-height:38px}
.bar-info>div{flex:1;line-height:1.55}
.bar-info.on{color:var(--ink);background:var(--pri-soft)}
.t-v{font-size:8.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tb tr[data-act]:active{background:var(--bg)}

/* 提示 */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(20,24,32,.88);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;
  z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:1}

/* 完全版新增：备份同步状态、导入向导、人情与牌局视图 */
.sync-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--sub)}
.sync-pill.ok{background:var(--green-soft);color:var(--green)}
.sync-pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.sync-pill.err{background:var(--danger-soft);color:var(--danger)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.st-box{background:var(--bg);border-radius:12px;padding:10px 12px}
.st-box .st-t{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:4px}
.st-box .st-v{font-size:13.5px;font-weight:600;margin-top:4px;word-break:break-all}
.st-box .st-s{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.45}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1;min-width:120px}
.help-box{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:8px}
.help-box summary{cursor:pointer;font-weight:600;color:var(--pri)}
.map-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.map-row:last-child{border-bottom:0}
.map-row .m-src{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row select{max-width:56%;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--inp);padding:0 8px;font-size:13px}
.pv-tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;overflow-x:auto;display:block}
.pv-tb th,.pv-tb td{padding:5px 7px;border:1px solid var(--line);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.pv-tb th{background:var(--bg);color:var(--sub);font-weight:600}
.top-tools{display:flex;gap:6px;align-items:center}
.pill-btn{height:32px;padding:0 11px;border-radius:16px;font-size:12.5px;font-weight:600;background:var(--pri-soft);color:var(--pri);display:inline-flex;align-items:center;gap:4px}
.pill-btn:active{filter:brightness(.93)}
.person-tag{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:0 6px;border-radius:6px;background:var(--orange-soft);color:var(--orange);margin-left:4px;font-weight:500;vertical-align:1px}
.rq-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rq-sum>div{background:var(--bg);border-radius:12px;padding:10px 6px}
.rq-sum span{display:block;font-size:12px;color:var(--sub)}
.rq-sum b{display:block;font-size:16px;margin-top:3px}
.bk-file{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.bk-file:last-child{border-bottom:0}
.bk-file .bf-mid{flex:1;min-width:0}
.bk-file .bf-mid b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-file .bf-mid small{font-size:12px;color:var(--sub)}

/* v3.0 旗舰美化：金刚区、计算器键盘、财务洞察、资产渐变卡、借还进度、皮肤选择器 */
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 10px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;font-size:12px;color:var(--ink2);font-weight:500}
.tool-item:active{background:var(--bg);transform:scale(.95)}
.tool-ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--pri-soft)}
.tool-ic.c1{background:#FEE2E2} .tool-ic.c2{background:#FEF3C7} .tool-ic.c3{background:#DCFCE7} .tool-ic.c4{background:#DBEAFE}
.tool-ic.c5{background:#F3E8FF} .tool-ic.c6{background:#CFFAFE} .tool-ic.c7{background:#FFEDD5} .tool-ic.c8{background:#F1F5F9}
html[data-theme=dark] .tool-ic.c1{background:#3B1C22} html[data-theme=dark] .tool-ic.c2{background:#382B14}
html[data-theme=dark] .tool-ic.c3{background:#143326} html[data-theme=dark] .tool-ic.c4{background:#1A2B4C}
html[data-theme=dark] .tool-ic.c5{background:#2D1E4A} html[data-theme=dark] .tool-ic.c6{background:#14323B}
html[data-theme=dark] .tool-ic.c7{background:#3A2416} html[data-theme=dark] .tool-ic.c8{background:#242936}

.asset-hero{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:var(--r);margin:8px 14px 12px;padding:20px 18px;box-shadow:0 10px 26px rgba(15,23,42,.15);position:relative;overflow:hidden}
.asset-hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.asset-hero span{font-size:13px;opacity:.82}
.asset-hero b.big{display:block;font-size:34px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.asset-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.asset-sub div span{display:block;font-size:11.5px;opacity:.78}
.asset-sub div b{font-size:14.5px;font-weight:700}

.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins-box{background:var(--bg);border-radius:14px;padding:11px 12px}
.ins-box span{display:block;font-size:12px;color:var(--sub)}
.ins-box b{display:block;font-size:17px;margin-top:3px;font-weight:700}
.ins-box small{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
.delta-up{color:var(--danger)!important} .delta-dn{color:var(--green)!important}

.tpl-bar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 2px;scrollbar-width:none}
.tpl-bar::-webkit-scrollbar{display:none}
.tpl-pill{flex:none;padding:5px 11px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:12.5px;font-weight:600;white-space:nowrap}
.tpl-pill.calc-on{background:var(--pri);color:#fff}

.calc-pad{background:var(--bg);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));flex:none}
.calc-expr{font-size:12.5px;color:var(--sub);text-align:right;padding:0 6px 6px;min-height:20px;font-variant-numeric:tabular-nums}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.calc-grid button{height:44px;border-radius:12px;background:var(--card);font-size:19px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.calc-grid button:active{transform:scale(.95);filter:brightness(.94)}
.calc-grid button.op{background:var(--pri-soft);color:var(--pri);font-size:17px}
.calc-grid button.ok{background:linear-gradient(135deg,var(--pri),var(--hd2));color:#fff;font-size:16px}

.skin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.skin-chip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:var(--bg);border:2px solid transparent;font-size:12px;font-weight:600}
.skin-chip.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.skin-dot{width:26px;height:26px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.18)}

.debt-card{padding:12px 16px;border-bottom:1px solid var(--line)}
.debt-card:last-child{border-bottom:0}
.debt-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.debt-meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.sumbar{bottom:calc(62px + env(safe-area-inset-bottom))}
.ri.excluded{opacity:.58}
.recur-jump{display:flex;align-items:center;justify-content:space-between;margin:6px 16px 2px;padding:10px 12px;border-radius:12px;background:var(--pri-soft);color:var(--pri);font-size:13px;font-weight:600}
.recur-jump:active{filter:brightness(.95)}
.period-bar{display:flex;gap:5px;width:100%}
.period-bar .chip{flex:1;min-width:0;padding:6px 2px;text-align:center;font-size:12.5px;border-radius:14px}

/* ========== 1. 工具函数 ========== */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const ymOf = s => s.slice(0, 7);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
function addMonth(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
function monthRange(ym) { const [y, m] = ym.split('-').map(Number); return [`${ym}-01`, `${ym}-${pad(new Date(y, m, 0).getDate())}`]; }
const money = c => (c < 0 ? '-' : '') + (Math.abs(c) / 100).toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
function short(c) { const v = Math.abs(c) / 100; const s = c < 0 ? '-' : ''; if (v >= 10000) return s + (v / 10000).toFixed(v >= 100000 ? 0 : 1) + '万'; return s + (Number.isInteger(v) ? String(v) : v.toFixed(2)); }
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const TYPE_NAME = {expense: '支出', income: '收入', transfer: '转账'};
function dateLabel(s) {
  const d = new Date(s + 'T00:00:00'), t = today(), y = ymd(new Date(Date.now() - 864e5));
  const tag = s === t ? ' · 今天' : s === y ? ' · 昨天' : '';
  const yr = s.slice(0, 4) !== t.slice(0, 4) ? d.getFullYear() + '年' : '';
  return `${yr}${d.getMonth() + 1}月${d.getDate()}日 星期${WEEK[d.getDay()]}${tag}`;
}
/** 金额校验：返回 {cents} 或 {err} */
function parseAmount(s) {
  s = String(s ?? '').trim().replace(/[,，\s]/g, '').replace(/^[¥￥]/, '').replace(/。/g, '.');
  if (!s) return {err: '请输入金额'};
  if (s.startsWith('-')) return {err: '金额不能是负数'};
  if (!/^(\d+(\.\d*)?|\.\d+)$/.test(s)) return {err: '金额必须是数字'};
  if (/\.\d{3,}$/.test(s)) return {err: '金额最多两位小数'};
  const c = Math.round(parseFloat(s) * 100);
  if (!(c > 0)) return {err: '金额必须大于 0'};
  if (c > 99999999999) return {err: '金额太大了'};
  return {cents: c};
}
function toast(msg, ms = 1800) {
  const t = $('#toast'); t.textContent = String(msg?.message ?? msg); t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
/** 照片压缩：长边最大 1280px，JPEG 质量 0.72 */
function compressImage(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('这张图片读取失败')); };
    img.src = url;
  });
}

/* ========== 2. 存储层（IndexedDB v3：无缝兼容旧版，新增借还欠款表） ========== */
const Storage = (() => {
  const NAME = 'xiaozhangben', VER = 3;
  const STORES = ['categories', 'accounts', 'tags', 'templates', 'records', 'photos', 'meta', 'recurring', 'debts'];
  let db = null; const mem = {}; STORES.forEach(s => mem[s] = new Map());
  const rp = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('写入被中断')); });
  return {
    persistent: false, STORES,
    async open() {
      try {
        if (!window.indexedDB) throw new Error('no idb');
        db = await new Promise((res, rej) => {
          const r = indexedDB.open(NAME, VER);
          r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath: 'id'}); }); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
          setTimeout(() => rej(new Error('timeout')), 4000);
        });
        this.persistent = true;
      } catch (e) { db = null; this.persistent = false; }
    },
    async getAll(s) { if (!db) return [...mem[s].values()].map(x => structuredClone(x)); return rp(db.transaction(s).objectStore(s).getAll()); },
    async get(s, id) { if (!db) return mem[s].get(id); return rp(db.transaction(s).objectStore(s).get(id)); },
    async put(s, obj) { if (!db) { mem[s].set(obj.id, structuredClone(obj)); return; } const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).put(obj); return done(tx); },
    async putMany(s, arr) { if (!db) { arr.forEach(o => mem[s].set(o.id, structuredClone(o))); return; } const tx = db.transaction(s, 'readwrite'); const st = tx.objectStore(s); arr.forEach(o => st.put(o)); return done(tx); },
    async del(s, id) { if (!db) { mem[s].delete(id); return; } const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).delete(id); return done(tx); },
    async clear(s) { if (!db) { mem[s].clear(); return; } const tx = db.transaction(s, 'readwrite'); tx.objectStore(s).clear(); return done(tx); },
  };
})();
const PHOTO_CACHE = new Map();
let _suspendSync = false;
function persist(store, obj) {
  const p = Storage.put(store, JSON.parse(JSON.stringify(obj))).catch(e => toast('保存失败：' + (e?.message || e)));
  if (!_suspendSync && store !== 'meta' && typeof Sync !== 'undefined') Sync.markDirty(store);
  return p;
}
function unpersist(store, id) {
  const p = Storage.del(store, id).catch(e => toast('删除失败：' + (e?.message || e)));
  if (!_suspendSync && store !== 'meta' && typeof Sync !== 'undefined') Sync.markDirty(store);
  return p;
}

/* ========== 3. 数据层（业务规则都在这里） ========== */
const DEFAULT_EXP = [

  ['服饰美容', '👗', [['衣服', '👕'], ['鞋包', '👟'], ['配饰', '💍'], ['美妆护肤', '💄'], ['理发美容', '💇']]],

  ['文教娱乐', '🎓', [['书籍', '📚'], ['课程培训', '📝'], ['考试', '✏️'], ['旅游', '🏖️'], ['电影演出', '🎭'], ['游戏', '🎮'], ['牌局娱乐', '🀄'], ['运动健身', '🏃'], ['数码产品', '💻']]],
  ['医疗健康', '🏥', [['门诊', '🩺'], ['药品', '💊'], ['体检', '📋'], ['住院', '🛏️'], ['保健品', '🌿']]],

];

const DEFAULT_BACKUP = () => ({

const vShort = c => S.settings.hideMoney ? '**' : short(c);

const Store = {
  async init() {
    await Storage.open();
    for (const k of ['categories', 'accounts', 'tags', 'templates', 'records', 'recurring', 'debts']) S[k] = await Storage.getAll(k);
    const st = (await Storage.getAll('meta')).find(x => x.id === 'settings');
    if (st) {
      Object.assign(S.settings, st);
      S.settings.backup = {...DEFAULT_BACKUP(), ...(st.backup || {})};
      S.settings.ai = {...DEFAULT_AI(), ...(st.ai || {})};
      if (!Array.isArray(S.settings.backup.uploadedPhotos)) S.settings.backup.uploadedPhotos = [];
    }
    if (!S.categories.length && !S.accounts.length) await this.seed();
    reindex();
  },
  async seed() {
    const cats = [];
    DEFAULT_EXP.forEach(([n, ic, ch], i) => {
      const pid = uid(); cats.push({id: pid, type: 'expense', parentId: null, name: n, icon: ic, order: i, hidden: false});
      ch.forEach(([cn, cic], j) => cats.push({id: uid(), type: 'expense', parentId: pid, name: cn, icon: cic, order: j, hidden: false}));
    });
    DEFAULT_INC.forEach(([n, ic], i) => cats.push({id: uid(), type: 'income', parentId: null, name: n, icon: ic, order: i, hidden: false}));
    const accs = DEFAULT_ACC.map(([n, ic], i) => ({id: uid(), name: n, icon: ic, init: 0, order: i, hidden: false}));
    S.categories = cats; S.accounts = accs; S.tags = []; S.templates = []; S.records = []; S.recurring = []; S.debts = [];
    await Storage.putMany('categories', cats); await Storage.putMany('accounts', accs);

  },
  saveSettings() { persist('meta', S.settings); },

  /* ---- 查询 ---- */
  cat: id => IDX.cat.get(id), acc: id => IDX.acc.get(id), tag: id => IDX.tag.get(id),
  parents(type, all) { return S.categories.filter(c => c.type === type && !c.parentId && (all || !c.hidden)).sort(byOrder); },
  children(pid, all) { return S.categories.filter(c => c.parentId === pid && (all || !c.hidden)).sort(byOrder); },
  isLeaf(c) { return !!c.parentId || this.children(c.id).length === 0; },
  /** 可以记账的分类：二级分类 + 没有可见二级的一级分类 */
  leafCats(type, all) { const out = []; this.parents(type, all).forEach(p => { const ch = this.children(p.id, all); if (ch.length) out.push(...ch); else out.push(p); }); return out; },
  catName(id) { return this.cat(id)?.name ?? '未分类'; },
  catFull(id) { const c = this.cat(id); if (!c) return '未分类'; const p = c.parentId && this.cat(c.parentId); return p ? `${p.name} · ${c.name}` : c.name; },
  catIcon(id) { return this.cat(id)?.icon || '❔'; },
  topOf(id) { const c = this.cat(id); if (!c) return null; return c.parentId ? (this.cat(c.parentId) || c) : c; },
  accounts(all) { return S.accounts.filter(a => all || !a.hidden).sort(byOrder); },
  accName(id) { return this.acc(id)?.name ?? '未知账户'; },
  tags() { return [...S.tags].sort(byOrder); },
  live() { return S.records.filter(r => !r.deletedAt); },
  balances() {
    const m = new Map(S.accounts.map(a => [a.id, a.init || 0])); const add = (id, v) => m.set(id, (m.get(id) || 0) + v);
    for (const r of S.records) {
      if (r.deletedAt) continue;
      if (r.type === 'expense') add(r.accountId, -r.amount);
      else if (r.type === 'income') add(r.accountId, r.amount);
      else { add(r.accountId, -r.amount); add(r.toAccountId, r.amount); }
    }
    return m;
  },
  recentCats(type, n = 10) {
    const seen = new Set(), out = [];
    const rs = this.live().filter(r => r.type === type).sort((a, b) => b.createdAt - a.createdAt);
    for (const r of rs) {
      if (seen.has(r.categoryId)) continue; seen.add(r.categoryId);
      const c = this.cat(r.categoryId); if (!c || c.hidden) continue;
      if (c.parentId && this.cat(c.parentId)?.hidden) continue;
      if (!this.isLeaf(c)) continue;
      out.push(c); if (out.length >= n) break;
    }
    return out;
  },

  /* ---- 记录 ---- */
  saveRecord(d) {
    const now = Date.now(); let r = d.id ? S.records.find(x => x.id === d.id) : null;
    if (!r) { r = {id: uid(), createdAt: now}; S.records.push(r); }
    const isT = d.type === 'transfer';
    Object.assign(r, {type: d.type, amount: d.amount, categoryId: isT ? null : d.categoryId, accountId: d.accountId,
      toAccountId: isT ? d.toAccountId : null, date: d.date, note: d.note || '', person: isT ? '' : (d.person || '').trim(),
      tagIds: d.tagIds || [], photoIds: d.photoIds || [], big: d.type === 'expense' && !!d.big, updatedAt: now});
    persist('records', r); return r;
  },
  recentPersons(n = 12) {
    const seen = new Set(), out = [];
    const rs = this.live().filter(r => r.person).sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
    for (const r of rs) { const p = r.person.trim(); if (!p || seen.has(p)) continue; seen.add(p); out.push(p); if (out.length >= n) break; }
    return out;
  },
  isRenqingCat(catId) {
    const c = this.cat(catId); if (!c) return false;
    const top = this.topOf(catId);
    const names = [c.name, top?.name || ''].join(' ');
    return /人情|红包|礼金|送礼|请客|孝敬|随礼/.test(names);
  },
  isGameCat(catId) {
    const c = this.cat(catId); if (!c) return false;
    return /麻将|牌局|扑克|打牌|棋牌/.test(c.name);
  },
  /** 删除 = 放进回收站（第二阶段做找回界面） */
  deleteRecord(id) { const r = S.records.find(x => x.id === id); if (!r) return; r.deletedAt = Date.now(); persist('records', r); },

  /* ---- 通用：排序 ---- */
  move(list, item, dir, store) {
    list.forEach((x, k) => x.order = k);
    const i = list.indexOf(item), j = i + dir; if (j < 0 || j >= list.length) return false;
    [list[i].order, list[j].order] = [list[j].order, list[i].order];
    list.forEach(x => persist(store, x)); return true;
  },

  /* ---- 分类 ---- */
  catSiblings(c) { return S.categories.filter(x => x.type === c.type && (x.parentId || null) === (c.parentId || null)).sort(byOrder); },
  saveCategory({id, type, parentId = null, name, icon}) {
    name = (name || '').trim();
    if (!name) throw '请输入分类名称';
    if (name.length > 12) throw '分类名称最多 12 个字';
    const old = id && this.cat(id);
    if (old) { type = old.type; parentId = old.parentId; }
    if (S.categories.some(c => c.id !== id && c.type === type && (c.parentId || null) === (parentId || null) && c.name === name)) throw `同一级下已经有「${name}」了`;
    let c = old;
    if (c) { c.name = name; if (icon) c.icon = icon; }
    else {
      const sib = S.categories.filter(x => x.type === type && (x.parentId || null) === (parentId || null));
      c = {id: uid(), type, parentId: parentId || null, name, icon: icon || '📌', order: sib.length ? Math.max(...sib.map(x => x.order ?? 0)) + 1 : 0, hidden: false};
      S.categories.push(c);
    }
    reindex(); persist('categories', c); return c;
  },
  catTreeIds(id) { return [id, ...S.categories.filter(c => c.parentId === id).map(c => c.id)]; },
  countCatRecords(ids) { const set = new Set(ids); return S.records.filter(r => set.has(r.categoryId)).length; },
  /** 删除分类：有记录时必须给 targetId，记录会转过去 */
  deleteCategory(id, targetId) {
    const ids = new Set(this.catTreeIds(id));
    if (targetId && ids.has(targetId)) throw '不能转到要删除的分类里';
    const bills = S.recurring.filter(b => ids.has(b.categoryId));
    const need = S.records.some(r => ids.has(r.categoryId)) || bills.length > 0;
    if (need && !targetId) throw '这个分类下有记录，请先选择转到哪个分类';
    bills.forEach(b => { b.categoryId = targetId; persist('recurring', b); });
    const cb = S.settings.catBudgets || {}; let cbch = false; ids.forEach(i => { if (cb[i] != null) { delete cb[i]; cbch = true; } }); if (cbch) this.saveSettings();
    S.records.forEach(r => { if (ids.has(r.categoryId)) { r.categoryId = targetId; r.updatedAt = Date.now(); persist('records', r); } });
    S.templates.forEach(t => { if (ids.has(t.categoryId)) { t.categoryId = targetId || null; persist('templates', t); } });
    S.categories = S.categories.filter(c => !ids.has(c.id)); ids.forEach(i => unpersist('categories', i));
    reindex();
  },

  /* ---- 账户 ---- */
  saveAccount({id, name, init = 0, icon}) {
    name = (name || '').trim();
    if (!name) throw '请输入账户名称';
    if (name.length > 12) throw '账户名称最多 12 个字';
    if (S.accounts.some(a => a.id !== id && a.name === name)) throw `已经有叫「${name}」的账户了`;
    let a = id && this.acc(id);
    if (a) Object.assign(a, {name, init, icon: icon || a.icon});
    else { a = {id: uid(), name, init, icon: icon || '💳', order: S.accounts.length ? Math.max(...S.accounts.map(x => x.order ?? 0)) + 1 : 0, hidden: false}; S.accounts.push(a); }
    reindex(); persist('accounts', a); return a;
  },
  countAccRecords(id) { return S.records.filter(r => r.accountId === id || r.toAccountId === id).length; },
  deleteAccount(id, targetId) {
    if (targetId === id) throw '不能转到要删除的账户';
    if (S.accounts.length <= 1) throw '至少要保留一个账户';
    const bills = S.recurring.filter(b => b.accountId === id);
    const need = this.countAccRecords(id) > 0 || bills.length > 0;
    if (need && !targetId) throw '这个账户有记录，请先选择转到哪个账户';
    bills.forEach(b => { b.accountId = targetId; persist('recurring', b); });
    S.records.forEach(r => {
      let ch = false;
      if (r.accountId === id) { r.accountId = targetId; ch = true; }
      if (r.toAccountId === id) { r.toAccountId = targetId; ch = true; }
      if (ch) { r.updatedAt = Date.now(); persist('records', r); }
    });
    S.templates.forEach(t => { let ch = false; if (t.accountId === id) { t.accountId = targetId || null; ch = true; } if (t.toAccountId === id) { t.toAccountId = targetId || null; ch = true; } if (ch) persist('templates', t); });
    if (S.settings.lastAccountId === id) { S.settings.lastAccountId = targetId || null; this.saveSettings(); }
    S.accounts = S.accounts.filter(a => a.id !== id); unpersist('accounts', id); reindex();
  },

  /* ---- 标签 ---- */
  saveTag({id, name}) {
    name = (name || '').trim().replace(/^#/, '');
    if (!name) throw '请输入标签名称';
    if (name.length > 12) throw '标签最多 12 个字';
    if (S.tags.some(t => t.id !== id && t.name === name)) throw `已经有「${name}」这个标签了`;
    let t = id && this.tag(id);
    if (t) t.name = name;
    else { t = {id: uid(), name, order: S.tags.length ? Math.max(...S.tags.map(x => x.order ?? 0)) + 1 : 0}; S.tags.push(t); }
    reindex(); persist('tags', t); return t;
  },
  deleteTag(id) {
    S.records.forEach(r => { if (r.tagIds?.includes(id)) { r.tagIds = r.tagIds.filter(x => x !== id); persist('records', r); } });
    S.templates.forEach(t => { if (t.tagIds?.includes(id)) { t.tagIds = t.tagIds.filter(x => x !== id); persist('templates', t); } });
    S.tags = S.tags.filter(t => t.id !== id); unpersist('tags', id); reindex();
  },

  /* ---- 模板 ---- */
  saveTemplate(d) {
    let t = d.id && S.templates.find(x => x.id === d.id);
    if (t) Object.assign(t, d);
    else { t = {...d, id: uid(), order: S.templates.length}; S.templates.push(t); }
    persist('templates', t); return t;
  },
  deleteTemplate(id) { S.templates = S.templates.filter(t => t.id !== id); unpersist('templates', id); },

  /* ---- 备份 ---- */
  photoMonthMap() {
    const m = {};
    for (const r of S.records) {
      if (!r.photoIds?.length) continue;
      const ym = /^\d{4}-\d{2}/.test(r.date || '') ? r.date.slice(0, 7) : 'other';
      r.photoIds.forEach(pid => { if (!m[pid]) m[pid] = ym; });
    }
    return m;
  },
  /** 核心业务数据导出（不含坚果云明文密码、AI 密钥与照片大图，适合云端增量同步） */
  exportCoreObj() {
    const safeSettings = {...S.settings};
    if (safeSettings.backup) safeSettings.backup = {...safeSettings.backup, webdavPass: ''};
    if (safeSettings.ai) safeSettings.ai = {...safeSettings.ai, apiKey: ''};
    return {
      app: 'xiaozhangben', version: 4, exportedAt: new Date().toISOString(),
      data: {categories: S.categories, accounts: S.accounts, tags: S.tags, templates: S.templates, records: S.records, recurring: S.recurring, debts: S.debts, settings: safeSettings},
      photoMonths: this.photoMonthMap(),
    };
  },
  async exportAll() {
    const photos = await Storage.getAll('photos');
    return JSON.stringify({...this.exportCoreObj(), photos});
  },
  /** 导出为 Excel 可直接打开的 UTF-8 BOM CSV 文件 */
  exportCsv() {
    const q = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const head = ['日期', '类型', '金额', '一级分类', '二级分类', '账户', '转入账户', '往来对象', '标签', '大额', '备注'];
    const rows = this.live().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt).map(r => {
      const c = this.cat(r.categoryId), p = c?.parentId ? this.cat(c.parentId) : null;
      const c1 = r.type === 'transfer' ? '转账' : (p ? p.name : (c?.name || ''));
      const c2 = r.type === 'transfer' ? '' : (p ? c.name : '');
      const tags = (r.tagIds || []).map(id => this.tag(id)?.name).filter(Boolean).join('、');
      return [r.date, TYPE_NAME[r.type] || r.type, (r.amount / 100).toFixed(2), c1, c2, this.accName(r.accountId),
        r.toAccountId ? this.accName(r.toAccountId) : '', r.person || '', tags, isBig(r) ? '是' : '', r.note || ''].map(q).join(',');
    });
    return '\uFEFF' + [head.join(','), ...rows].join('\r\n');
  },
  async importAll(obj, {keepBackupCfg = true} = {}) {
    if (!obj || obj.app !== 'xiaozhangben' || !obj.data) throw '这不是本 App 的备份文件';
    const prevBk = keepBackupCfg ? JSON.parse(JSON.stringify(S.settings.backup || DEFAULT_BACKUP())) : DEFAULT_BACKUP();
    const prevAi = keepBackupCfg ? JSON.parse(JSON.stringify(S.settings.ai || DEFAULT_AI())) : DEFAULT_AI();
    _suspendSync = true;
    try {
      for (const k of ['categories', 'accounts', 'tags', 'templates', 'records', 'recurring', 'debts']) {
        S[k] = Array.isArray(obj.data[k]) ? obj.data[k] : [];
        await Storage.clear(k); if (S[k].length) await Storage.putMany(k, S[k]);
      }
      if (Array.isArray(obj.photos)) {
        await Storage.clear('photos'); PHOTO_CACHE.clear();
        if (obj.photos.length) await Storage.putMany('photos', obj.photos);
      }
      const inSet = obj.data.settings || {};
      S.settings = {...DEFAULT_SETTINGS(), ...inSet, id: 'settings', introDone: true,
        backup: keepBackupCfg ? {...DEFAULT_BACKUP(), ...prevBk, dirty: false} : {...DEFAULT_BACKUP(), ...(inSet.backup || {})},
        ai: keepBackupCfg ? {...DEFAULT_AI(), ...prevAi} : {...DEFAULT_AI(), ...(inSet.ai || {})}};
      this.saveSettings();
      reindex();
    } finally { _suspendSync = false; }
  },
  async clearAll() {
    const prevBk = JSON.parse(JSON.stringify(S.settings.backup || DEFAULT_BACKUP()));
    _suspendSync = true;
    try {
      for (const k of Storage.STORES) await Storage.clear(k);
      PHOTO_CACHE.clear();
      S.settings = {...DEFAULT_SETTINGS(), introDone: true, backup: {...prevBk, uploadedPhotos: [], dirty: false}};
      this.saveSettings();
      await this.seed();
    } finally { _suspendSync = false; }
  },
};

/* 支出的两种"特殊账"：
   固定 = 周期账每一期自动记的支出（月供、话费、会员…）
   大额 = 周期账的首付/提前结清，以及记账时手动标了「大额」的支出
   全局开关 incFixed / incBig 决定首页、预算、报表、明细合计算不算它们；收入永远照算 */
const isFixed = r => r.type === 'expense' && !!r.recurId && r.recurPeriod > 0;
const isBig = r => r.type === 'expense' && (!!r.big || (!!r.recurId && (r.recurPeriod === 0 || r.recurPeriod === -1)));
const countsExp = r => r.type === 'expense' && (!isFixed(r) || S.settings.incFixed) && (!isBig(r) || S.settings.incBig);
function toggleChips(fx, bg, light) {
  const st = S.settings, one = (on, act, ic, name, amt) => `<button class="${on ? 'on' : ''}" data-act="${act}"><span>${ic} ${name}${amt ? ' ' + short(amt) : ''}</span><small>${on ? '✓ 已计入' : '未计入'}</small></button>`;
  return `<div class="tgl ${light ? 'light' : ''}">${one(st.incFixed, 'togFixed', '🔁', '固定支出', fx)}${one(st.incBig, 'togBig', '💰', '大额支出', bg)}</div>`;
}

  if (p === 'month') return monthRange(ym);

}

const Layers = {
  stack: [],
  open(html, {cls = '', onClose} = {}) {
    const el = document.createElement('div'); el.className = 'layer ' + cls; el.innerHTML = html;
    $('#layers').appendChild(el); void el.offsetWidth; el.classList.add('show');
    const L = {el, onClose}; this.stack.push(L); return el;
  },
  get(el) { return this.stack.find(l => l.el === el); },
  closeEl(el) {
    const i = this.stack.findIndex(l => l.el === el); if (i < 0) return;
    const [L] = this.stack.splice(i, 1); el.classList.remove('show'); setTimeout(() => el.remove(), 240);
    L.onClose && L.onClose();
  },
  closeTop() { const L = this.stack[this.stack.length - 1]; if (L) { this.closeEl(L.el); return true; } return false; },
};

    if (b.status !== 'active') continue;

    const d = Recur.dueDate(b, k);
    if (d > t && d <= lim) hits.push({name: b.name, d, left: daysBetween(t, d), amt: Recur.amountFor(b, k), type: b.type});
  }
  if (!hits.length) return '';
  hits.sort((a, b) => a.left - b.left);
  const h = hits[0];
  return `<div class="banner" data-act="openRecur"><span>📅 <b>${h.left} 天后</b>（${+h.d.slice(5, 7)}/${+h.d.slice(8)}）自动记账：${esc(h.name)} <b>${h.type === 'expense' ? '-' : '+'}${vMoney(h.amt)}</b>${hits.length > 1 ? ` 等 ${hits.length} 笔` : ''}</span><span class="chev">${IC.chev}</span></div>`;

function evalCalcExpr(str) {
  const s = String(str ?? '').trim().replace(/[¥￥,，\s]/g, '').replace(/。/g, '.');
  if (!s) return null;
  if (!/^[0-9.+\-]+$/.test(s)) return null;
  const tokens = s.match(/[+\-]?(\d+(\.\d*)?|\.\d+)/g);
  if (!tokens || tokens.join('') !== s.replace(/^[+]/, '')) {
    const clean = s.replace(/[+\-]+$/, '');
    const t2 = clean.match(/[+\-]?(\d+(\.\d*)?|\.\d+)/g);
    if (!t2 || !clean) return null;
    const sum2 = t2.reduce((acc, x) => acc + parseFloat(x), 0);
    return isFinite(sum2) ? Math.round(sum2 * 100) / 100 : null;
  }
  const sum = tokens.reduce((acc, x) => acc + parseFloat(x), 0);
  return isFinite(sum) ? Math.round(sum * 100) / 100 : null;
}

ACT.calcKey = el => {
  if (!F) return;
  const k = el.dataset.k;
  if (k === 'C') F.amount = '';
  else if (k === 'BS') F.amount = F.amount.slice(0, -1);
  else if (k === '=') {
    const v = evalCalcExpr(F.amount);
    if (v != null) F.amount = Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/\.?0+$/, '');
  } else if (k === '+' || k === '-') {
    if (!F.amount) return;
    if (/[+\-]$/.test(F.amount)) F.amount = F.amount.slice(0, -1) + k;
    else F.amount += k;
  } else if (k === '.') {
    const curSeg = F.amount.split(/[+\-]/).pop();
    if (!curSeg.includes('.')) F.amount += curSeg ? '.' : '0.';
  } else {
    const curSeg = F.amount.split(/[+\-]/).pop();
    if (/\.\d{2}$/.test(curSeg)) return;
    F.amount += k;
  }
  const inp = $('#fAmt', F.el); if (inp) inp.value = F.amount;
  const pad = $('#fCalcPad', F.el);

/* ---- 模板 ---- */
function tplSummary(t) {
  const parts = [TYPE_NAME[t.type]];
  if (t.type === 'transfer') parts.push(`${t.accountId ? Store.accName(t.accountId) : '?'} → ${t.toAccountId ? Store.accName(t.toAccountId) : '?'}`);
  else { if (t.categoryId) parts.push(Store.catName(t.categoryId)); if (t.accountId) parts.push(Store.accName(t.accountId)); }
  if (t.amount != null) parts.push('¥' + money(t.amount));
  if (t.note) parts.push(t.note);
  return parts.join(' · ');
}
function saveTplFromForm() {
  const name = F.tplName.trim(); if (!name) return fErr('请填写模板名称');
  let cents = null; if (F.amount.trim()) { const p = parseAmount(F.amount); if (p.err) return fErr(p.err); cents = p.cents; }
  if (F.type === 'transfer' && F.accountId && F.accountId === F.toAccountId) return fErr('转出和转入不能是同一个账户');
  if (S.templates.some(t => t.name === name && t.id !== F.tplId)) return fErr('已经有同名的模板了');
  Store.saveTemplate({id: F.tplId, name, type: F.type, amount: cents, categoryId: F.type === 'transfer' ? null : F.categoryId,
    accountId: F.accountId, toAccountId: F.type === 'transfer' ? F.toAccountId : null, note: F.note.trim(), tagIds: [...F.tagIds]});
  toast('模板已保存'); Layers.closeEl(F.el); refreshAll();
}

const PALETTE = ['#2D6BCF', '#17A673', '#F0A232', '#EC6A3C', '#8E5BD6', '#14A3B8', '#D9468C', '#7A9A2E', '#C2843B', '#5C6B8A'];
const GRAN_NAME = {year: '年', month: '月', week: '周', all: '全部', quarter: '季', last7: '近7天', last30: '近30天', last365: '近1年', custom: '自定义'};
function weekStartOf(ds) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
function addDays(ds, n) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
const md = ds => `${+ds.slice(5, 7)}/${+ds.slice(8)}`;
function rpRange() {
  const rp = UI.rp, t = today();
  switch (rp.gran) {
    case 'year': return [`${rp.year}-01-01`, `${rp.year}-12-31`];
    case 'month': return monthRange(rp.ym);
    case 'week': return [rp.wk, addDays(rp.wk, 6)];
    case 'quarter': { const m0 = (rp.q - 1) * 3 + 1; return [`${rp.year}-${pad(m0)}-01`, monthRange(`${rp.year}-${pad(m0 + 2)}`)[1]]; }
    case 'last7': return [addDays(t, -6), t];
    case 'last30': return [addDays(t, -29), t];
    case 'last365': return [addDays(t, -364), t];
    case 'all': {
      let lo = null, hi = null; S.records.forEach(r => { if (r.deletedAt) return; if (!lo || r.date < lo) lo = r.date; if (!hi || r.date > hi) hi = r.date; });
      return lo ? [lo, hi > t ? hi : t] : [t, t];
    }
    default: return rp.start <= rp.end ? [rp.start, rp.end] : [rp.end, rp.start];
  }

function nowTimeLabel() { const d = new Date(); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function markBackup(kind) {
  const lbl = nowTimeLabel(), ts = Date.now(), bk = S.settings.backup || (S.settings.backup = DEFAULT_BACKUP());
  S.settings.lastBackup = lbl; S.settings.lastBackupTs = ts;
  if (kind === 'local') { bk.lastLocalTs = ts; bk.lastLocalLabel = lbl; }
  if (kind === 'cloud') { bk.lastCloudTs = ts; bk.lastCloudLabel = lbl; bk.lastCloudErr = ''; bk.dirty = false; }
  Store.saveSettings();
}
function getFsPlugin() { return IS_APP && window.Capacitor?.Plugins?.Filesystem ? window.Capacitor.Plugins.Filesystem : null; }
function getNetPlugin() { return IS_APP && window.Capacitor?.Plugins?.Network ? window.Capacitor.Plugins.Network : null; }
function cleanDirName(s, def) { return (String(s || '').trim().replace(/[\\/:*?"<>|]/g, '') || def); }

/** DataURL 与二进制互转，用于把照片以真实 .jpg 原图存到坚果云按月文件夹 */
function dataUrlToBytes(dataUrl) {
  const idx = dataUrl.indexOf(',');
  const b64 = idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToDataUrl(bytes, mime = 'image/jpeg') {
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let bin = ''; const step = 8192;
  for (let i = 0; i < u8.length; i += step) bin += String.fromCharCode(...u8.subarray(i, i + step));
  return `data:${mime};base64,` + btoa(bin);
}
function b64Utf8(str) {
  const u8 = new TextEncoder().encode(str);
  let bin = ''; for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}

/** 本地文件备份模块（安卓 Capacitor Filesystem + 网页降级下载） */
const LocalBackup = {
  dir() { return cleanDirName(S.settings.backup?.localDir, '小账本备份'); },
  hasNative() { return !!getFsPlugin(); },
  async ensureDir(fs) {
    try { await fs.mkdir({path: this.dir(), directory: 'DOCUMENTS', recursive: true}); } catch (_) {}
  },
  async writeNative(filename, content) {
    const fs = getFsPlugin(); if (!fs) throw new Error('当前为网页版，不支持直接写入手机文件夹');
    await this.ensureDir(fs);
    const full = `${this.dir()}/${filename}`;
    await fs.writeFile({path: full, data: content, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true});
    return `Documents/${full}`;
  },
  async autoSave() {
    const fs = getFsPlugin(); if (!fs) return false;
    const json = await Store.exportAll();
    await this.writeNative('auto-backup.json', json);
    // 每天保留一份独立快照，自动保留最近 7 天，防止误操作覆盖
    const dayFile = `daily-${today()}.json`;
    await this.writeNative(dayFile, json);
    try {
      const res = await fs.readdir({path: this.dir(), directory: 'DOCUMENTS'});
      const dailies = (res.files || []).map(f => typeof f === 'string' ? f : f.name).filter(n => /^daily-\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort();
      while (dailies.length > 7) { const old = dailies.shift(); await fs.deleteFile({path: `${this.dir()}/${old}`, directory: 'DOCUMENTS'}).catch(() => {}); }
    } catch (_) {}
    markBackup('local');
    return true;
  },
  async manualSave() {
    const json = await Store.exportAll();
    const d = new Date();
    const fname = `小账本备份_${today()}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    if (this.hasNative()) {
      const path = await this.writeNative(fname, json);
      markBackup('local');
      return {native: true, path, size: json.length};
    }
    const url = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    markBackup('local');
    return {native: false, path: fname, size: json.length};
  },
  async listNativeFiles() {
    const fs = getFsPlugin(); if (!fs) return [];
    await this.ensureDir(fs);
    const res = await fs.readdir({path: this.dir(), directory: 'DOCUMENTS'});
    return (res.files || []).map(f => (typeof f === 'string' ? {name: f, size: 0, mtime: 0} : {name: f.name, size: f.size || 0, mtime: f.mtime || 0}))
      .filter(f => f.name.endsWith('.json')).sort((a, b) => (b.mtime || 0) - (a.mtime || 0) || (a.name < b.name ? 1 : -1));
  },
  async readNativeFile(name) {
    const fs = getFsPlugin(); if (!fs) throw new Error('仅安卓版可直接读取手机备份目录');
    const r = await fs.readFile({path: `${this.dir()}/${name}`, directory: 'DOCUMENTS', encoding: 'utf8'});
    return r.data;
  },
};

/** 坚果云 WebDAV 模块（使用 fetch，安卓 APK 内已开启 CapacitorHttp 原生直连无跨域限制） */
const WebDAV = {
  cfg() { return S.settings.backup || DEFAULT_BACKUP(); },
  isConfigured() { const c = this.cfg(); return !!(c.webdavUrl?.trim() && c.webdavUser?.trim() && c.webdavPass?.trim()); },
  baseUrl() { let u = (this.cfg().webdavUrl || 'https://dav.jianguoyun.com/dav/').trim(); if (!u.endsWith('/')) u += '/'; return u; },
  rootPath() { return cleanDirName(this.cfg().webdavDir, '小账本'); },
  joinUrl(...parts) { return this.baseUrl() + parts.filter(Boolean).map(p => p.split('/').map(encodeURIComponent).join('/')).join('/'); },
  authHeader() { const c = this.cfg(); return 'Basic ' + b64Utf8(`${c.webdavUser.trim()}:${c.webdavPass.trim()}`); },
  async req(method, url, {headers = {}, body = null, expectBin = false} = {}) {
    const h = {'Authorization': this.authHeader(), ...headers};
    const res = await fetch(url, {method, headers: h, body});
    if (expectBin) return {status: res.status, ok: res.ok, buf: res.ok ? await res.arrayBuffer() : null};
    const text = await res.text().catch(() => '');
    return {status: res.status, ok: res.ok, text};
  },
  async mkcol(relPath) {
    const segs = relPath.split('/').filter(Boolean);
    let cur = '';
    for (const s of segs) {
      cur = cur ? `${cur}/${s}` : s;
      const r = await this.req('MKCOL', this.joinUrl(cur) + '/');
      // 201 创建成功，405/301/200 表示目录已存在，均属正常
      if (![200, 201, 204, 301, 405].includes(r.status)) {
        if (r.status === 401 || r.status === 403) throw new Error('账号或应用密码不对（401/403），请检查坚果云「应用密码」');
        throw new Error(`创建云端目录失败（状态码 ${r.status}）`);
      }
    }
  },
  async test() {
    if (!this.isConfigured()) throw new Error('请先填写坚果云账号和应用密码');
    const r = await this.req('PROPFIND', this.baseUrl(), {headers: {'Depth': '0'}});
    if (r.status === 401 || r.status === 403) throw new Error('认证失败：请确认用的是坚果云「第三方应用密码」（不是登录密码）');
    if (r.status >= 400) throw new Error(`连接失败（状态码 ${r.status}）`);
    await this.mkcol(`${this.rootPath()}/photos`);
    return true;
  },
  /** 上传核心业务数据 + 按月增量上传新照片 */
  async syncUp() {
    if (!this.isConfigured()) throw new Error('尚未配置坚果云账号和应用密码');
    const root = this.rootPath();
    await this.mkcol(`${root}/photos`);
    // 1. 上传核心 JSON（不含照片大图，秒传）
    const core = Store.exportCoreObj();
    const putCore = await this.req('PUT', this.joinUrl(root, 'backup-data.json'), {
      headers: {'Content-Type': 'application/json; charset=utf-8'},
      body: JSON.stringify(core),
    });
    if (![200, 201, 204].includes(putCore.status)) {
      if (putCore.status === 401 || putCore.status === 403) throw new Error('坚果云账号或应用密码失效');
      throw new Error(`上传账本数据失败（状态码 ${putCore.status}）`);
    }
    // 2. 照片按月份目录增量上传（已传过的跳过）
    const uploaded = new Set(this.cfg().uploadedPhotos || []);
    const allPhotos = await Storage.getAll('photos');
    const monthMap = core.photoMonths || {};
    const madeMonths = new Set();
    let newPhotoCount = 0;
    for (const ph of allPhotos) {
      if (!ph?.id || !ph.data || uploaded.has(ph.id)) continue;
      const ym = monthMap[ph.id] || 'other';
      if (!madeMonths.has(ym)) { await this.mkcol(`${root}/photos/${ym}`); madeMonths.add(ym); }
      const bytes = dataUrlToBytes(ph.data);
      const pr = await this.req('PUT', this.joinUrl(root, 'photos', ym, `${ph.id}.jpg`), {
        headers: {'Content-Type': 'image/jpeg'},
        body: bytes,
      });
      if (![200, 201, 204].includes(pr.status)) throw new Error(`上传照片失败（状态码 ${pr.status}）`);
      uploaded.add(ph.id); newPhotoCount++;
    }
    this.cfg().uploadedPhotos = [...uploaded];
    markBackup('cloud');
    return {records: Store.live().length, newPhotos: newPhotoCount};
  },
  /** 从坚果云完整恢复（核心 JSON + 按月拉取全部关联照片） */
  async restoreDown() {
    if (!this.isConfigured()) throw new Error('请先填写坚果云账号和应用密码');
    const root = this.rootPath();
    const r = await this.req('GET', this.joinUrl(root, 'backup-data.json'));
    if (r.status === 404) throw new Error(`坚果云「${root}」目录里还没有备份文件`);
    if (r.status === 401 || r.status === 403) throw new Error('账号或应用密码不对（401/403）');
    if (!r.ok) throw new Error(`下载失败（状态码 ${r.status}）`);
    let obj; try { obj = JSON.parse(r.text); } catch (_) { throw new Error('云端备份文件已损坏'); }
    if (!obj || obj.app !== 'xiaozhangben' || !obj.data) throw new Error('云端文件不是小账本的备份');
    const monthMap = obj.photoMonths || {};
    const needIds = new Set();
    (obj.data.records || []).forEach(rec => (rec.photoIds || []).forEach(id => needIds.add(id)));
    const photos = [];
    for (const pid of needIds) {
      const ym = monthMap[pid] || 'other';
      const pr = await this.req('GET', this.joinUrl(root, 'photos', ym, `${pid}.jpg`), {expectBin: true});
      if (pr.ok && pr.buf && pr.buf.byteLength > 0) photos.push({id: pid, data: bytesToDataUrl(pr.buf, 'image/jpeg')});
    }
    obj.photos = photos;
    return obj;
  },
};

/** 自动同步协调器（防抖 + 断网缓存 + 联网补传） */
const Sync = {
  _timer: null, _busy: false, _online: navigator.onLine !== false,
  markDirty() {
    const bk = S.settings.backup || (S.settings.backup = DEFAULT_BACKUP());
    if (bk.webdavOn && WebDAV.isConfigured()) { bk.dirty = true; Store.saveSettings(); }
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.autoRun(), 2600);
  },
  async isOnline() {
    const np = getNetPlugin();
    if (np) { try { const st = await np.getStatus(); this._online = !!st.connected; return this._online; } catch (_) {} }
    this._online = navigator.onLine !== false;
    return this._online;
  },
  async autoRun() {
    if (this._busy) return;
    const bk = S.settings.backup || DEFAULT_BACKUP();
    this._busy = true;
    try {
      if (bk.localAuto && LocalBackup.hasNative()) {
        try { await LocalBackup.autoSave(); } catch (e) { console.warn('本地自动备份失败', e); }
      }
      if (bk.webdavOn && WebDAV.isConfigured() && bk.dirty) {
        if (await this.isOnline()) {
          try { await WebDAV.syncUp(); }
          catch (e) { bk.lastCloudErr = errOf(e); Store.saveSettings(); }
        }
      }
    } finally {
      this._busy = false;
      Layers.stack.forEach(l => l.refresh && l.refresh());
    }
  },
  async flushPending(silent = true) {
    const bk = S.settings.backup || DEFAULT_BACKUP();
    if (!bk.webdavOn || !WebDAV.isConfigured() || !bk.dirty) return;
    if (!(await this.isOnline())) return;
    if (!silent) toast('网络已恢复，正在补传到坚果云…', 2500);
    await this.autoRun();
    if (!silent && !bk.dirty) toast('坚果云补传完成 ✓', 1800);
  },
  initListeners() {
    window.addEventListener('online', () => this.flushPending(false));
    const np = getNetPlugin();
    if (np) { try { np.addListener('networkStatusChange', st => { this._online = !!st.connected; if (st.connected) this.flushPending(false); }); } catch (_) {} }
  },
};

/* ================= 挖财旧账导入（零依赖 Excel .xlsx + .csv） ================= */
const TableParser = {
  /** 解析 CSV（自动兼容 UTF-8 / BOM / GB18030 中文编码） */
  decodeText(buf) {
    const u8 = new Uint8Array(buf);
    if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
    try { return new TextDecoder('utf-8', {fatal: true}).decode(u8); }
    catch (_) { return new TextDecoder('gb18030').decode(u8); }
  },
  parseCsv(text) {
    const rows = []; let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') inQ = false;
        else cell += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ',') { row.push(cell.trim()); cell = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell.trim()); if (row.some(x => x !== '')) rows.push(row);
          row = []; cell = '';
        } else cell += ch;
      }
    }
    row.push(cell.trim()); if (row.some(x => x !== '')) rows.push(row);
    return rows;
  },
  /** 零依赖解析 .xlsx（基于浏览器原生 DecompressionStream 解压 ZIP） */
  async parseXlsx(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    // 查找 ZIP 中央目录结尾 EOCD
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('这不是有效的 .xlsx Excel 文件（如果是旧版 .xls，请先用 Excel 另存为 .xlsx 或 .csv）');
    const cdSize = dv.getUint32(eocd + 12, true), cdOff = dv.getUint32(eocd + 16, true);
    const entries = new Map();
    let p = cdOff;
    while (p < cdOff + cdSize) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), compSize = dv.getUint32(p + 20, true);
      const fnLen = dv.getUint16(p + 28, true), exLen = dv.getUint16(p + 30, true), cmLen = dv.getUint16(p + 32, true);
      const lfhOff = dv.getUint32(p + 42, true);
      const name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + fnLen));
      entries.set(name, {method, compSize, lfhOff});
      p += 46 + fnLen + exLen + cmLen;
    }
    async function readEntry(name) {
      const e = entries.get(name); if (!e) return null;
      const o = e.lfhOff, fnL = dv.getUint16(o + 26, true), exL = dv.getUint16(o + 28, true);

        const ds = new DecompressionStream('deflate-raw');

      const doc = new DOMParser().parseFromString(ssXml, 'application/xml');

        let t = ''; si.querySelectorAll('t').forEach(n => t += n.textContent || ''); shared.push(t);
      });
    }
    const sheetNames = [...entries.keys()].filter(k => /^xl\/worksheets\/sheet\d+\.xml$/i.test(k)).sort();

      const xml = await readEntry(sName); if (!xml) continue;
      const doc = new DOMParser().parseFromString(xml, 'application/xml');

      doc.querySelectorAll('sheetData > row').forEach(rEl => {
        const arr = [];
        rEl.querySelectorAll('c').forEach(cEl => {
          const ref = cEl.getAttribute('r') || '';

          const t = cEl.getAttribute('t');
          let val = '';
          if (t === 's') { const idx = +(cEl.querySelector('v')?.textContent || -1); val = shared[idx] ?? ''; }

          else val = cEl.querySelector('v')?.textContent ?? '';

    return this.parseCsv(this.decodeText(buf));
  },
};
