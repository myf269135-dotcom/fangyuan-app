function normImportDate(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  // Excel 序列日期（如 45612 或 45612.5）
  if (/^\d{5}(\.\d+)?$/.test(s)) {
    const n = Math.floor(parseFloat(s));
    const d = new Date(Date.UTC(1899, 11, 30) + n * 864e5);
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  }
  const m = s.match(/(\d{4})[\/\-\.年](\d{1,2})[\/\-\.月](\d{1,2})/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  return '';
}
function guessWacaiCols(headers) {
  const find = re => headers.findIndex(h => re.test(h));

    date: find(/日期|时间|date/i),
    type: find(/收支|类型|账目类型|交易类型|方向|type/i),
    amount: find(/金额|消费金额|数额|amount/i),
    cat1: find(/大类|一级分类|支出大类|类别|主分类/i),
    cat2: find(/小类|二级分类|支出小类|子类|分类/i),
    acc: find(/^(账户|资金账户|转出账户|支付方式|付款账户|account)$/i) >= 0 ? find(/^(账户|资金账户|转出账户|支付方式|付款账户|account)$/i) : find(/账户|支付|account/i),
    toAcc: find(/转入账户|对方账户|目标账户/i),
    note: find(/备注|说明|描述|摘要|note/i),
    tag: find(/标签|成员|项目|tag/i),
  };
}
function autoMatchCat(type, c2, c1) {
  const leaf = Store.leafCats(type, true);
  const tryNames = [c2, c1].map(x => (x || '').trim()).filter(Boolean);
  for (const nm of tryNames) {
    const exact = leaf.find(c => c.name === nm); if (exact) return exact.id;
  }
  for (const nm of tryNames) {
    for (const [targetName, aliases] of Object.entries(WACAI_ALIAS)) {
      if (aliases.some(a => nm.includes(a) || a.includes(nm))) {
        const hit = leaf.find(c => c.name === targetName) || Store.parents(type, true).find(p => p.name === targetName);
        if (hit) { const ch = Store.children(hit.id, true); return ch.length ? ch[0].id : hit.id; }
      }
    }
    const fuzzy = leaf.find(c => nm.includes(c.name) || c.name.includes(nm)); if (fuzzy) return fuzzy.id;
  }
  return '__new__';
}
function autoMatchAcc(name) {
  name = (name || '').trim(); if (!name) return firstAcc() || '__new__';
  const accs = Store.accounts(true);
  const exact = accs.find(a => a.name === name); if (exact) return exact.id;
  if (/微信|wechat/i.test(name)) { const a = accs.find(x => x.name.includes('微信')); if (a) return a.id; }
  if (/支付宝|花呗|余额宝|alipay/i.test(name)) { const a = accs.find(x => x.name.includes('支付宝')); if (a) return a.id; }
  if (/现金|钱包/i.test(name)) { const a = accs.find(x => x.name.includes('现金')); if (a) return a.id; }
  if (/银行|储蓄|借记|信用|卡/i.test(name)) { const a = accs.find(x => x.name.includes('银行')); if (a) return a.id; }
  return '__new__';
}
function parseWacaiType(rawType, rawAmt) {
  const s = (rawType || '').trim();
  if (/转|互转|还款/.test(s)) return 'transfer';
  if (/收|进|入/.test(s)) return 'income';
  if (/支|出|花/.test(s)) return 'expense';
  if (String(rawAmt || '').trim().startsWith('-')) return 'expense';

}
function buildWacaiPreview() {
  const {rows, col} = WC;

  const seenCats = new Map(), seenAccs = new Set();
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const date = normImportDate(col.date >= 0 ? r[col.date] : '');
    const rawAmt = col.amount >= 0 ? r[col.amount] : '';
    const cleanAmt = String(rawAmt || '').replace(/[¥￥,，\s]/g, '').replace(/^[+-]/, '');
    const amtP = parseAmount(cleanAmt);
    if (!date || amtP.err) { bad.push(i + 2); continue; }
    const type = parseWacaiType(col.type >= 0 ? r[col.type] : '', rawAmt);
    const c1 = col.cat1 >= 0 ? (r[col.cat1] || '').trim() : '';
    const c2 = col.cat2 >= 0 ? (r[col.cat2] || '').trim() : '';
    const accName = (col.acc >= 0 ? (r[col.acc] || '').trim() : '') || '默认账户';
    let toAccName = col.toAcc >= 0 ? (r[col.toAcc] || '').trim() : '';
    if (type === 'transfer' && !toAccName && accName.includes('->')) {
      const sp = accName.split('->'); toAccName = (sp[1] || '').trim();
    }
    const note = col.note >= 0 ? (r[col.note] || '').trim() : '';
    const tagStr = col.tag >= 0 ? (r[col.tag] || '').trim() : '';
    if (type !== 'transfer') {
      const catKey = `${type}|${c2 || c1 || '未分类'}`;
      if (!seenCats.has(catKey)) {
        seenCats.set(catKey, {key: catKey, type, c1, c2, label: c2 || c1 || '未分类'});
        if (!WC.catMap[catKey]) WC.catMap[catKey] = autoMatchCat(type, c2, c1);
      }
    }
    const fromAcc = accName.includes('->') ? accName.split('->')[0].trim() : accName;
    seenAccs.add(fromAcc); if (!WC.accMap[fromAcc]) WC.accMap[fromAcc] = autoMatchAcc(fromAcc);
    if (toAccName) { seenAccs.add(toAccName); if (!WC.accMap[toAccName]) WC.accMap[toAccName] = autoMatchAcc(toAccName); }
    const dupKey = `${date}|${type}|${amtP.cents}|${fromAcc}|${note}`;
    const isDup = dupSet.has(dupKey);
    parsed.push({date, type, amount: amtP.cents, catKey: `${type}|${c2 || c1 || '未分类'}`, c1, c2, fromAcc, toAcc: toAccName, note, tagStr, isDup});

}

ACT.wcCommit = async () => {
  const pv = WC.preview; const todo = WC.skipDup ? pv.parsed.filter(x => !x.isDup) : pv.parsed;
  if (!todo.length) return toast('没有可导入的新记录');
  toast(`正在导入 ${todo.length} 笔…`, 8000);
  _suspendSync = true;
  try {
    // 1. 创建缺失账户
    const accIdMap = {};
    for (const aName of pv.accs) {
      let target = WC.accMap[aName];
      if (!target || target === '__new__') {
        const clean = aName.slice(0, 12) || '导入账户';
        const exist = S.accounts.find(a => a.name === clean);
        target = exist ? exist.id : Store.saveAccount({name: clean, init: 0, icon: '💳'}).id;
      }
      accIdMap[aName] = target;
    }
    // 2. 创建缺失分类
    const catIdMap = {};
    for (const c of pv.cats) {
      let target = WC.catMap[c.key];
      if (!target || target === '__new__') {
        const clean = (c.label || '其他').slice(0, 12);
        const exist = Store.leafCats(c.type, true).find(x => x.name === clean);
        if (exist) target = exist.id;
        else {
          const otherP = c.type === 'expense' ? S.categories.find(x => x.type === 'expense' && !x.parentId && x.name === '其他') : null;
          target = Store.saveCategory({type: c.type, parentId: otherP?.id || null, name: clean, icon: '📌'}).id;
        }

      catIdMap[c.key] = target;
    }
    // 3. 批量写入记录

    todo.forEach((x, idx) => {
      const tagIds = [];

        x.tagStr.split(/[,，、;\s]+/).map(s => s.trim()).filter(Boolean).forEach(tn => {
          const clean = tn.slice(0, 12);
          let tg = S.tags.find(t => t.name === clean);
          if (!tg) tg = Store.saveTag({name: clean});
          if (!tagIds.includes(tg.id)) tagIds.push(tg.id);
        });
      }
      const fromId = accIdMap[x.fromAcc] || firstAcc();
      let toId = x.type === 'transfer' ? (accIdMap[x.toAcc] || Store.accounts().find(a => a.id !== fromId)?.id || fromId) : null;
      const r = {
        id: uid(), createdAt: now + idx, updatedAt: now + idx, type: x.type, amount: x.amount,
        categoryId: x.type === 'transfer' ? null : (catIdMap[x.catKey] || null),
        accountId: fromId, toAccountId: toId, date: x.date, note: x.note, person: '',
        tagIds, photoIds: [], big: false,

};

function guessLocalCategory(text, type = 'expense') {
  const s = String(text || '').trim();
  const leaves = Store.leafCats(type);
  if (!leaves.length) return null;
  if (s) {
    // 1. 直接命中用户自定义分类名（支持用户自建如“蔬菜”“肉蛋”）
    const direct = leaves.find(c => s.includes(c.name) || c.name.includes(s));
    if (direct) return direct.id;
    // 2. 命中内置常见商户/商品规则
    for (const [catName, re] of LOCAL_CAT_RULES) {
      if (re.test(s)) {
        const hit = leaves.find(c => c.name === catName) || Store.parents(type).find(p => p.name === catName);
        if (hit) { const ch = Store.children(hit.id); return ch.length ? ch[0].id : hit.id; }
      }
    }
  }
  const other = leaves.find(c => c.name.includes('其他')) || leaves[leaves.length - 1];
  return other?.id || null;
}
function matchCategoryByName(name, type = 'expense') {
  const n = String(name || '').trim();
  const leaves = Store.leafCats(type);
  if (!n) return guessLocalCategory('', type);
  const seg = n.includes('-') ? n.split('-').pop().trim() : n.includes('·') ? n.split('·').pop().trim() : n;
  return leaves.find(c => c.name === seg)?.id || leaves.find(c => c.name === n)?.id
    || leaves.find(c => seg.includes(c.name) || c.name.includes(seg))?.id || guessLocalCategory(n, type);
}
function matchAccountByName(name) {
  const n = String(name || '').trim(), accs = Store.accounts();
  if (!n) return Store.acc(S.settings.lastAccountId) ? S.settings.lastAccountId : firstAcc();
  return accs.find(a => a.name === n)?.id || accs.find(a => n.includes(a.name) || a.name.includes(n))?.id
    || (Store.acc(S.settings.lastAccountId) ? S.settings.lastAccountId : firstAcc());
}
function extractJsonBlock(text) {
  const s = String(text || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try { return JSON.parse(s); } catch (_) {}
  const m = s.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
  if (m) return JSON.parse(m[1]);
  throw new Error('AI 返回格式无法解析，请重试一次');
}

const AI = {
  cfg() { return S.settings.ai || (S.settings.ai = DEFAULT_AI()); },
  ready() { const c = this.cfg(); return !!(c.apiUrl?.trim() && c.apiKey?.trim() && c.textModel?.trim()); },
  schemaContext() {
    const expTree = Store.parents('expense').map(p => {
      const ch = Store.children(p.id);
      return ch.length ? `${p.name}(${ch.map(x => x.name).join('/')})` : p.name;
    }).join('；');
    const incList = Store.leafCats('income').map(c => c.name).join('、');
    const accList = Store.accounts().map(a => a.name).join('、');
    return `今天日期：${today()}。\n支出分类（严格从括号内二级分类选）：${expTree}\n收入分类：${incList}\n账户：${accList}`;
  },
  async chat(messages, {vision = false, maxTokens = 1200} = {}) {
    const c = this.cfg();
    if (!c.apiUrl?.trim() || !c.apiKey?.trim()) throw new Error('请先在「设置 → 智能助手」里填写 API Key');
    const model = vision ? (c.visionModel?.trim() || c.textModel?.trim()) : c.textModel?.trim();
    if (!model) throw new Error('请先填写模型名称');
    const res = await fetch(c.apiUrl.trim(), {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${c.apiKey.trim()}`},
      body: JSON.stringify({model, messages, temperature: 0.15, max_tokens: maxTokens}),
    });
    const raw = await res.text().catch(() => '');
    if (!res.ok) {
      let msg = `请求失败（${res.status}）`;
      try { const j = JSON.parse(raw); if (j.error?.message) msg = j.error.message; } catch (_) {}
      throw new Error(msg);
    }
    const j = JSON.parse(raw);
    const content = j.choices?.[0]?.message?.content;
    if (!content) throw new Error('AI 未返回有效内容');
    return typeof content === 'string' ? content : content.map(x => x.text || '').join('');
  },
  async test() {
    const reply = await this.chat([{role: 'user', content: '只回复“连接成功”四个字'}], {maxTokens: 32});
    return reply.trim();
  },
  async parseText(input) {
    const sys = `你是个人记账解析助手。请把用户输入的一句或多句消费/收入/转账/人情/借钱拆成严格 JSON 数组，不要输出任何额外解释。\n${this.schemaContext()}\n每项格式：\n- 普通记账：{"kind":"record","type":"expense|income|transfer","amount":数字(元),"category":"二级分类名","account":"账户名","toAccount":"转入账户(仅转账)","date":"YYYY-MM-DD","person":"往来人名(人情/红包时填，否则空字符串)","note":"简短备注","tags":["可选标签"]}\n- 借入借出（如借给某人/向某人借钱/垫付）：{"kind":"debt","dir":"lend|borrow","person":"对方姓名","amount":数字(元),"date":"YYYY-MM-DD","dueDate":"YYYY-MM-DD或空","account":"账户名","note":"备注"}`;
    const txt = await this.chat([{role: 'system', content: sys}, {role: 'user', content: input}]);
    const parsed = extractJsonBlock(txt);
    return Array.isArray(parsed) ? parsed : [parsed];
  },
  async parseReceipt(dataUrl) {
    const sys = `你是小票与账单截图识别助手。请仔细识别图片中的商家、日期、账户（微信/支付宝/银行卡/现金）和每一笔商品或交易明细，返回严格 JSON 对象（不要多余文字）：\n${this.schemaContext()}\n返回格式：{"merchant":"商家或账单来源","date":"YYYY-MM-DD","account":"账户名","sceneTag":"适合打的短标签如超市采购/微信账单","items":[{"name":"商品名或消费描述","type":"expense|income","amount":数字(元),"category":"最匹配的二级分类名","person":"人名或空","note":"简短备注"}]}`;
    const txt = await this.chat([
      {role: 'system', content: sys},
      {role: 'user', content: [{type: 'text', text: '请识别这张小票或账单截图里的全部明细，严格按 JSON 返回。'}, {type: 'image_url', image_url: {url: dataUrl}}]},
    ], {vision: true, maxTokens: 1600});
    return extractJsonBlock(txt);
  },
  async guessCategory(note, type) {
    const leaves = Store.leafCats(type).map(c => c.name).join('、');
    const txt = await this.chat([
      {role: 'system', content: `只从以下分类里选最匹配的一个名字原样返回，不要解释：${leaves}`},
      {role: 'user', content: `消费描述：${note}`},
    ], {maxTokens: 32});
    return matchCategoryByName(txt.trim(), type);
  },
  /** 严格脱敏财务分析：只发汇总数字与大类金额，绝不传备注、人名、账户余额 */
  async analyzeReport(summary) {
    const sys = '你是专业又接地气的个人理财顾问。根据提供的脱敏汇总数据（不含任何个人隐私与明细备注），用简明中文分 3 点给出：1. 本期收支亮点与风险；2. 主要花销结构点评；3. 下个月最容易落地的 2 条省钱建议。控制在 260 字以内。';
    return await this.chat([{role: 'system', content: sys}, {role: 'user', content: JSON.stringify(summary)}], {maxTokens: 600});
  },
};

function normalizeAiItem(x, defDate, defAcc) {
  const amt = Math.round(parseFloat(x?.amount) * 100);
  if (!(amt > 0)) return null;
  const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') ? x.date : (defDate || today());
  if (x.kind === 'debt') {
    return {checked: true, kind: 'debt', dir: x.dir === 'borrow' ? 'borrow' : 'lend', person: (x.person || '未命名').trim(),
      amount: amt, date, dueDate: /^\d{4}-\d{2}-\d{2}$/.test(x.dueDate || '') ? x.dueDate : '',
      accountId: matchAccountByName(x.account || defAcc), note: (x.note || '').trim()};
  }
  const type = ['expense', 'income', 'transfer'].includes(x.type) ? x.type : 'expense';
  return {
    checked: true, kind: 'record', type, amount: amt,
    categoryId: type === 'transfer' ? null : matchCategoryByName(x.category || x.name || x.note, type),
    accountId: matchAccountByName(x.account || defAcc),
    toAccountId: type === 'transfer' ? matchAccountByName(x.toAccount) : null,
    date, person: (x.person || '').trim(),
    note: (x.note || x.name || '').trim(),
    tagNames: Array.isArray(x.tags) ? x.tags.filter(Boolean) : [],
  };
}

CH.aiReceiptFile = async inp => {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  toast('正在压缩并让 AI 识别图片…', 20000);
  try {
    const dataUrl = await compressImage(f, 1280, 0.78);
    const res = await AI.parseReceipt(dataUrl);
    const defDate = /^\d{4}-\d{2}-\d{2}$/.test(res.date || '') ? res.date : today();
    const defAcc = res.account || '';
    const sceneTag = (res.sceneTag || res.merchant || '小票采购').replace(/^#/, '').slice(0, 12);
    const rawList = Array.isArray(res.items) ? res.items : [];
    const splitItems = rawList.map(it => {
      const n = normalizeAiItem({...it, kind: 'record', account: it.account || defAcc, date: it.date || defDate}, defDate, defAcc);
      if (n && sceneTag) n.tagNames = [sceneTag];
      return n;
    }).filter(Boolean);
    if (!splitItems.length) return toast('图片里没有识别到有效消费金额');
    // 构造“整单合并 1 笔”方案（把全部商品名与金额自动写入备注，方便搜单字！）
    const expItems = splitItems.filter(x => x.type === 'expense');
    const mergeSrc = expItems.length ? expItems : splitItems;
    const totalAmt = mergeSrc.reduce((s, x) => s + x.amount, 0);
    // 选占比最大的分类作为主分类
    const catSum = new Map();
    mergeSrc.forEach(x => catSum.set(x.categoryId, (catSum.get(x.categoryId) || 0) + x.amount));
    const topCat = [...catSum.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || mergeSrc[0].categoryId;
    const detailStr = mergeSrc.map(x => `${x.note || Store.catName(x.categoryId)}${(x.amount / 100).toFixed(x.amount % 100 ? 1 : 0)}`).join('、');
    const mergedNote = `${res.merchant ? res.merchant + '：' : ''}${detailStr}`.slice(0, 100);
    const mergedItem = {
      checked: true, kind: 'record', type: mergeSrc[0].type, amount: totalAmt, categoryId: topCat,
      accountId: mergeSrc[0].accountId, toAccountId: null, date: defDate, person: '',
      note: mergedNote, tagNames: sceneTag ? [sceneTag] : [],
    };
    AI_REVIEW = {mode: splitItems.length > 1 ? 'split' : 'merge', source: 'receipt', merchant: res.merchant || '', sceneTag, rawItems: splitItems, mergedItem};
    openAiReviewPage();
  } catch (e) { toast('识图失败：' + errOf(e), 4000); }
};

const PayCapture = {
  plugin() { return IS_APP && window.Capacitor?.Plugins?.PayCapture ? window.Capacitor.Plugins.PayCapture : null; },
  async syncEnabled() {
    const p = this.plugin(); if (!p) return;
    try { await p.setEnabled({enabled: !!S.settings.ai?.notifyOn}); } catch (_) {}
  },
  async openSettings() {
    const p = this.plugin();
    if (!p) return toast('网页版无法打开手机系统设置，请安装安卓 APK 后使用', 2800);
    await p.openSettings();
  },
  ingestItems(items) {
    if (!Array.isArray(items) || !items.length) return 0;
    const ai = AI.cfg();
    if (!Array.isArray(ai.pendingCaptures)) ai.pendingCaptures = [];
    let autoSaved = 0;
    for (const raw of items) {
      const amount = Math.round(Number(raw.amount) || 0);
      if (!(amount > 0)) continue;
      const type = raw.type === 'income' ? 'income' : 'expense';
      const merchant = (raw.merchant || '').trim();
      const note = merchant || (raw.rawText || '').slice(0, 36) || `${raw.source || '支付'}自动捕获`;
      const categoryId = guessLocalCategory(`${merchant} ${raw.rawText || ''}`, type);
      const accountId = matchAccountByName(raw.source || '微信');
      const date = raw.date || ymd(new Date(raw.ts || Date.now()));
      if (ai.notifyAutoSave) {
        Store.saveRecord({type, amount, categoryId, accountId, toAccountId: null, date, note, person: '', tagIds: [], photoIds: [], big: false});
        autoSaved++;
      } else {
        ai.pendingCaptures.unshift({id: uid(), source: raw.source || '微信', type, amount, categoryId, accountId, date, note, merchant, rawText: raw.rawText || ''});
      }
    }
    Store.saveSettings();
    if (autoSaved) toast(`🔔 已自动捕获并记账 ${autoSaved} 笔`, 2800);
    return items.length;
  },
  async poll() {
    if (!S.settings.ai?.notifyOn) return 0;
    const p = this.plugin(); if (!p) return 0;
    try {
      const res = await p.drainQueue();
      const n = this.ingestItems(res?.items || []);
      if (n) refreshAll();
      return n;
    } catch (_) { return 0; }
  },
};

function dueOf(ym, day) { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(Math.min(day, new Date(y, m, 0).getDate()))}`; }
const Recur = {
  STATUS: {active: '进行中', paused: '已暂停', ended: '已结束', settled: '已结清'},
  get(id) { return S.recurring.find(b => b.id === id); },
  amountFor(b, k) { let v = b.amount; [...(b.changes || [])].sort((x, y) => x.from - y.from).forEach(c => { if (k >= c.from) v = c.amount; }); return v; },
  dueDate(b, k) { return dueOf(addMonth(b.startYm, k - 1), b.day); },
  nextPeriod(b) { if (b.status !== 'active' && b.status !== 'paused') return null; const k = b.lastPeriod + 1; return b.periods && k > b.periods ? null : k; },
  curAmount(b) { return this.amountFor(b, this.nextPeriod(b) || b.lastPeriod || 1); },
  paid(b) { let s = (b.down || 0) + (b.settleAmount || 0); for (let k = 1; k <= b.lastPeriod; k++) s += this.amountFor(b, k); return s; },
  remainCount(b) { return !b.periods ? null : (b.status === 'settled' ? 0 : Math.max(0, b.periods - b.lastPeriod)); },
  remainAmount(b) { if (!b.periods || b.status === 'settled') return 0; let s = 0; for (let k = b.lastPeriod + 1; k <= b.periods; k++) s += this.amountFor(b, k); return s; },
  note(b, k) { return b.periods ? `${b.name} 第${k}/${b.periods}期` : `${b.name}（${+this.dueDate(b, k).slice(5, 7)}月）`; },
  addRecord(b, k, date, amount, note) {
    const now = Date.now();
    const r = {id: uid(), createdAt: now, updatedAt: now, type: b.type, amount, categoryId: b.categoryId, accountId: b.accountId, toAccountId: null,
      date, note, tagIds: [], photoIds: [], recurId: b.id, recurPeriod: k};
    S.records.push(r); persist('records', r); return r;
  },
  /** 补记所有已到期、还没记的账；记满期数自动结束 */
  run() {
    const t = today(); let n = 0;
    for (const b of S.recurring) {
      let ch = false, guard = 0;
      while (b.status === 'active' && guard++ < 1200) {
        const k = this.nextPeriod(b); if (!k) break;
        const d = this.dueDate(b, k); if (d > t) break;
        if (!Store.acc(b.accountId) || !Store.cat(b.categoryId)) break;
        this.addRecord(b, k, d, this.amountFor(b, k), this.note(b, k)); b.lastPeriod = k; n++; ch = true;
      }
      if (b.status === 'active' && b.periods && b.lastPeriod >= b.periods) { b.status = 'ended'; ch = true; }
      if (ch) persist('recurring', b);
    }
    return n;
  },
  records(b) { return S.records.filter(r => r.recurId === b.id && !r.deletedAt).sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : (y.recurPeriod || 0) - (x.recurPeriod || 0)); },
};
function runRecurring(showToast = true) { const n = Recur.run(); if (n) { if (showToast) toast(`已自动记了 ${n} 笔周期账`, 2500); refreshAll(); } return n; }
ACT.openRecur = () => openRecurList();

function recurListBody() {
  let fe = 0, fi = 0, remain = 0;

    if ((b.status === 'active' || b.status === 'paused') && b.type === 'expense') remain += Recur.remainAmount(b);
  });
  const order = {active: 0, paused: 1, ended: 2, settled: 3};
  const list = [...S.recurring].sort((a, b) => order[a.status] - order[b.status] || a.createdAt - b.createdAt);
  const row = b => {

      <div class="val ${cls}">${b.type === 'expense' ? '-' : '+'}${money(Recur.curAmount(b))}</div></div>`;

  <div class="card">${list.length ? list.map(row).join('') : '<div class="empty">还没有周期账<br><small>房贷、工资、房租、会员这类每月固定的收支，建一次就会按时自动记账</small></div>'}

}

/* ================= 预算 ================= */
function spentIn(ym, catId) {
  const [a, b] = monthRange(ym), ids = catId ? new Set(Store.catTreeIds(catId)) : null; let s = 0;
  for (const r of S.records) {
    if (r.deletedAt || !countsExp(r) || r.date < a || r.date > b) continue;
    if (ids && !ids.has(r.categoryId)) continue; s += r.amount;
  }
  return s;
}
function budgetStatus(ym) {
  return Object.entries(S.settings.catBudgets || {}).map(([id, amt]) => ({c: Store.cat(id), amt})).filter(o => o.c)
    .map(o => ({...o, sp: spentIn(ym, o.c.id)})).sort((x, y) => (y.sp / y.amt) - (x.sp / x.amt));
}
/** 记一笔支出后检查是否超预算：刚超出时弹窗，已经超了就轻提示 */
function checkBudget(r) {
  if (!r || !countsExp(r)) return;
  const ym = ymOf(r.date), msgs = []; let crossed = false;
  const chk = (name, amt, sp) => { if (sp > amt) { msgs.push(`${name}：预算 ${money(amt)}，已花 ${money(sp)}，<b style="color:var(--danger)">超支 ${money(sp - amt)}</b>`); if (sp - r.amount <= amt) crossed = true; } };
  if (S.settings.budget) chk(`${+ym.slice(5)}月总预算`, S.settings.budget, spentIn(ym));
  const cb = S.settings.catBudgets || {}, c = Store.cat(r.categoryId), anc = [r.categoryId, c?.parentId].filter(Boolean);
  anc.forEach(id => { if (cb[id] != null && Store.cat(id)) chk(`「${Store.cat(id).name}」`, cb[id], spentIn(ym, id)); });
  if (!msgs.length) return;
  if (crossed) setTimeout(() => dialog({title: '⚠️ 超支提醒', html: msgs.map(m => `<p>${m}</p>`).join('')}), 350);
  else setTimeout(() => toast('⚠️ ' + msgs[0].replace(/<[^>]+>/g, ''), 2800), 1300);
}

function openBudget() { openPage('预算', budgetBody); }

const Reminder = {
  ID: 202601,
  plugin() { return IS_APP && window.Capacitor?.Plugins?.LocalNotifications ? window.Capacitor.Plugins.LocalNotifications : null; },
  async sync(askPerm = false) {
    const p = this.plugin(); if (!p) return;
    const r = S.settings.remind || {on: false, time: '20:30'};
    try { await p.cancel({notifications: [{id: this.ID}]}); } catch (_) {}
    if (!r.on) return;
    try {
      let perm = await p.checkPermissions();
      if (perm.display !== 'granted' && askPerm) perm = await p.requestPermissions();
      if (perm.display !== 'granted') return;
      const [h, m] = (r.time || '20:30').split(':').map(Number);
      await p.schedule({
        notifications: [{
          id: this.ID, title: '小账本 · 记账提醒', body: '今天过得怎么样？花 10 秒记一笔账吧～',
          schedule: {on: {hour: isNaN(h) ? 20 : h, minute: isNaN(m) ? 30 : m}, repeats: true, allowWhileIdle: true},
        }],
      });
    } catch (e) { console.warn('通知调度失败', e); }
  },
};

function homeBanners() {
  const st = S.settings, bk = st.backup || DEFAULT_BACKUP(), t = today(), now = new Date(), out = [];
  const r = st.remind || {};
  if (r.on && `${pad(now.getHours())}:${pad(now.getMinutes())}` >= (r.time || '20:30') && st.remindDismissed !== t
      && !S.records.some(x => !x.deletedAt && !x.recurId && x.date === t)) {
    out.push(`<div class="banner">⏰<span>今天还没记账，现在记一笔？</span><button class="btn sm pri" data-act="addRec">记一笔</button><button class="x" data-act="dismissRemind">✕</button></div>`);
  }
  if (bk.webdavOn && WebDAV.isConfigured() && bk.dirty) {
    out.push(`<div class="banner">☁️<span>有新变动待同步到坚果云</span><button class="btn sm" data-act="flushCloudNow">立即同步</button></div>`);
  }
  const capN = (st.ai?.pendingCaptures || []).length;
  if (capN) {
    out.push(`<div class="banner">🔔<span>捕获到 <b>${capN}</b> 笔微信/支付宝付款待确认</span><button class="btn sm pri" data-act="openCaptureQueue">去入账</button></div>`);
  }
  const live = S.records.filter(x => !x.deletedAt);
  if (live.length && st.backupSnooze !== t) {
    const since = st.lastBackupTs || Math.min(...live.map(x => x.createdAt || Date.now()));
    const days = Math.floor((Date.now() - since) / 864e5);
    if (days >= 7) out.push(`<div class="banner">💾<span>${st.lastBackupTs ? `已经 ${days} 天没备份了` : '还没有备份过数据'}</span><button class="btn sm" data-act="goBackup">去备份</button><button class="x" data-act="snoozeBackup">✕</button></div>`);
  }
  return out.join('');
}

let lpTimer = null, lpFired = false, lpStart = null;
document.addEventListener('pointerdown', e => {
  lpFired = false; const el = e.target.closest('[data-lp]'); if (!el) return;
  lpStart = [e.clientX, e.clientY]; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpTimer = null; lpFired = true; try { navigator.vibrate && navigator.vibrate(12); } catch (_) {} LP[el.dataset.lp]?.(el); }, 520);
});
document.addEventListener('pointermove', e => { if (lpTimer && lpStart && (Math.abs(e.clientX - lpStart[0]) > 10 || Math.abs(e.clientY - lpStart[1]) > 10)) { clearTimeout(lpTimer); lpTimer = null; } });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { clearTimeout(lpTimer); lpTimer = null; }));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });
document.addEventListener('click', e => {
  if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(el, e)).catch(err => { console.error(err); toast(errOf(err)); }); }
}, true);
document.addEventListener('input', e => { const k = e.target.dataset?.in; if (k && IN[k]) IN[k](e.target, e); });
document.addEventListener('change', e => { const k = e.target.dataset?.ch; if (k && CH[k]) Promise.resolve(CH[k](e.target, e)).catch(err => toast(errOf(err))); });

/* 左右滑动 */
let swStart = null;
document.addEventListener('touchstart', e => {
  const el = e.target.closest('[data-swipe]');
  swStart = el && e.touches.length === 1 ? {el, x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now()} : null;
}, {passive: true});
document.addEventListener('touchend', e => {
  const s = swStart; swStart = null; if (!s) return;
  const t = e.changedTouches[0], dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - s.t < 800) { lpFired = false; SW[s.el.dataset.swipe]?.(s.el, dx < 0 ? 1 : -1); }
}, {passive: true});

/* ================= 启动 ================= */
(async function boot() {
  renderTabbar();
  try { await Store.init(); } catch (e) { console.error(e); toast('数据读取出错：' + errOf(e), 4000); }
  applyTheme();
  renderMain();
  Sync.initListeners();
  setTimeout(() => { runRecurring(); Reminder.sync(false); Sync.flushPending(true); PayCapture.syncEnabled(); PayCapture.poll(); }, 500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      runRecurring();
      Sync.flushPending(true);
      PayCapture.poll();
      if (!Layers.stack.length) renderMain();
    }
  });
  if (!S.settings.introDone) {
    const goBk = await dialog({
      title: '欢迎使用小账本完全版',
      html: IS_APP ? `<p>你的记账数据全部保存在本机里，安全私密、零广告。</p>
        <p>· <b>重要提醒：卸载 App 会清空应用内数据！</b></p>
        <p>· 建议现在就去开启<b>「手机本地自动备份」</b>或配置免费的<b>「坚果云自动备份」</b>，以后换手机、重装都不怕丢账。</p>`
        : `<p>当前为<b>网页预览版</b>，全部功能已就绪：</p>
        <p>· 支持首页月历、两级分类、周期账、预算提醒、挖财 Excel/CSV 导入、人情账簿与牌局统计；</p>
        <p>· 安装安卓 APK 后，自动开启手机文件夹备份、坚果云 WebDAV 自动同步与每日系统通知。</p>`,
      buttons: [{text: '稍后再说', onClick: () => false}, {text: '去设置备份（推荐）', cls: 'pri', onClick: () => true}],
    });
    S.settings.introDone = true; Store.saveSettings();
    if (goBk) openBackupCenter();
  }
})();
</script>
